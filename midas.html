function periodoCaixa() {
  const c = ui.caixa;
  if (c.periodo === "custom") return { chave: "custom", de: dataOk(c.de) ? c.de : "0000-01-01", ate: dataOk(c.ate) ? c.ate : "9999-12-31", rot: "período escolhido" };
  return periodoPor(c.periodo);
}
function lancFiltrados() {
  const c = ui.caixa, per = periodoCaixa(), q = norm(c.busca), h0 = hoje();
  const lista = db.lanc.filter((l) => noPeriodo(l.data, per) && (c.tipo === "todos" || l.tipo === c.tipo) && (c.cat === "todas" || l.categoria === c.cat)
    && (c.status === "todos" || (c.status === "vencido" ? l.status === "pendente" && l.data < h0 : l.status === c.status)) && (!q || norm(l.descricao).includes(q)));
  const asc = c.status === "pendente" || c.status === "vencido";
  return lista.sort((a, b) => (a.data === b.data ? 0 : (a.data < b.data) === asc ? -1 : 1));
}
function vendasFiltradas() {
  const per = periodoCaixa(), q = norm(ui.caixa.busca);
  return db.vendas.filter((v) => noPeriodo(v.data.slice(0, 10), per) && (!q || norm(`${v.cliente} ${v.itens.map((i) => i.nome).join(" ")} ${v.numero}`).includes(q))).sort((a, b) => (a.data < b.data ? 1 : -1));
}

function cartaoDRE(R, per) {
  const L = [
    ["Faturamento bruto (vendas)", R.faturamento, "b"], ["(−) Custo das mercadorias vendidas", -R.cmv, "m"], ["Lucro bruto", R.lucroBruto, "t", R.margemBrutaPct],
    ["(−) Despesas fixas", -R.fixas, "m"], ["(−) Despesas variáveis", -R.variaveis, "m"], ...(R.outros ? [["(−) Outras despesas", -R.outros, "m"]] : []),
    ["Lucro operacional", R.lucroOperacional, "d", R.faturamento > 0 ? (R.lucroOperacional / R.faturamento) * 100 : 0],
    ["(−) Impostos sobre as vendas", -R.impostos, "m"], ["(−) Taxas de cartão (maquininha)", -R.taxas, "m"], ...(R.outrasReceitas ? [["(+) Outras receitas", R.outrasReceitas, "m"]] : []),
    ["Lucratividade real", R.lucroReal, "d", R.margemRealPct],
  ];
  return h`<section class="card"><header><h2>Lucro operacional × lucratividade real</h2><span class="sub">${per.rot} · regime de competência</span></header>
    <div class="tablewrap"><table class="wf tab"><caption class="sr">Demonstrativo de resultado simplificado</caption><thead><tr><th>Demonstrativo</th><th class="r">%</th><th class="r">Valor</th></tr></thead>
    <tbody>${L.map(([rot, v, t, pct]) => h`<tr class="${t === "t" || t === "d" ? "t" : ""}" style="${t === "d" ? "background:rgba(245,158,11,.1)" : ""}"><th scope="row" ${t === "d" ? raw('style="color:var(--gold-ink)"') : ""}>${rot}</th><td class="r muted">${pct != null ? pc(pct, 1) : R.faturamento > 0 && t !== "b" ? pc((Math.abs(v) / R.faturamento) * 100, 1) : ""}</td><td class="r ${v < -0.005 && (t === "t" || t === "d") ? "neg" : ""}">${brl(v)}</td></tr>`)}</tbody></table></div>
    <p class="hint" style="margin-top:8px"><b>Lucro operacional</b> = o que a operação da loja gera depois de pagar a mercadoria vendida e as despesas do dia a dia. <b>Lucratividade real</b> = o que sobra de verdade, depois também de impostos e taxas de cartão. Compras de fornecedor e o pagamento do DAS mexem no caixa, mas não entram aqui para não contar duas vezes: a mercadoria vira custo quando é vendida e o imposto já está em cada venda.</p></section>`;
}

function caixaLista() {
  const ls = lancFiltrados(), ent = r2(ls.filter((l) => l.tipo === "receita").reduce((s, l) => s + l.valor, 0)), sai = r2(ls.filter((l) => l.tipo === "despesa").reduce((s, l) => s + l.valor, 0));
  const entPend = r2(ls.filter((l) => l.tipo === "receita" && l.status === "pendente").reduce((s, l) => s + l.valor, 0)), saiPend = r2(ls.filter((l) => l.tipo === "despesa" && l.status === "pendente").reduce((s, l) => s + l.valor, 0));
  const venc = db.lanc.filter((l) => l.tipo === "despesa" && l.status === "pendente" && l.data < hoje());
  const lim = ui.caixa.limite, linhas = ls.slice(0, lim).map((l) => ({ cls: l.status === "cancelado" ? "off" : "", cels: [
    h`<span class="strong nm">${l.descricao || "—"}</span>`, fmtData(l.data), CATS[l.categoria] || l.categoria, chipStatus(l),
    h`<b class="tab ${l.tipo === "receita" ? "pos" : ""}">${l.tipo === "receita" ? "+" : "−"} ${brl(l.valor)}</b>`,
    h`<div class="acoes">${l.status === "pendente" ? h`<button type="button" class="btn xs" data-act="lancBaixa" data-id="${l.id}">${ico("check")}${l.tipo === "receita" ? "Receber" : "Dar baixa"}</button>` : l.status === "pago" ? h`<button type="button" class="btn xs" data-act="lancReabrir" data-id="${l.id}">Reabrir</button>` : ""}${l.vendaId ? "" : h`<button type="button" class="btn xs danger" data-act="lancDel" data-id="${l.id}" aria-label="Excluir lançamento">${ico("trash")}</button>`}</div>`] }));
  return h`<div class="grid g4" id="cx-kpis">
      ${kpi("Entradas", brl(ent), entPend > 0 ? `${brl(entPend)} a receber` : "tudo recebido", "", "pos")}
      ${kpi("Saídas", brl(sai), saiPend > 0 ? `${brl(saiPend)} a pagar` : "tudo pago")}
      ${kpi("Saldo do período", brl(ent - sai), "entradas − saídas (caixa)", "", ent - sai < 0 ? "neg" : "")}
      ${kpi("Contas vencidas", brl(venc.reduce((s, l) => s + l.valor, 0)), venc.length ? `${venc.length} ${plural(venc.length, "conta", "contas")} em atraso` : "nenhuma em atraso", "", venc.length ? "neg" : "")}
    </div>
    <section class="card"><header><h2>Movimentações</h2><span class="sub">${ls.length} ${plural(ls.length, "lançamento", "lançamentos")}${ls.length > lim ? ` · mostrando ${lim}` : ""}</span></header>
      ${ls.length ? rt({ cols: "minmax(0,1.7fr) 86px 150px 110px 130px 170px", cab: ["Descrição", "Data", "Categoria", "Situação", "Valor", "Ações"], right: [4], full: [5], linhas }) : vazio("wallet", "Nenhum lançamento com esses filtros", "Mude o período ou os filtros, ou registre uma movimentação.", h`<button type="button" class="btn gold" data-act="movNova">${ico("plus")}Nova movimentação</button>`)}
      ${ls.length > lim ? h`<div class="row" style="justify-content:center;margin-top:12px"><button type="button" class="btn" data-act="cxMais">Mostrar mais ${Math.min(40, ls.length - lim)}</button></div>` : ""}</section>`;
}
function caixaVendas() {
  const vs = vendasFiltradas(), meta = db.empresa.meta, lim = ui.caixa.limite;
  const ativos = vs.filter((v) => v.status !== "cancelada"), lucro = r2(ativos.reduce((s, v) => s + v.lucro, 0)), fat = r2(ativos.reduce((s, v) => s + v.total, 0));
  const linhas = vs.slice(0, lim).map((v) => {
    const it = v.itens[0], canc = v.status === "cancelada";
    return { cls: canc ? "off" : "", cels: [
      h`<span class="strong nm">#${v.numero} · ${it.nome} × ${nf(it.qtd)}</span>${v.cliente ? h`<br><span class="tiny dim">${v.cliente}</span>` : ""}`, fmtData(v.data.slice(0, 10)), E.rotuloCondicao({ forma: v.forma, parcelas: v.parcelas }),
      h`<b class="tab">${brl(v.total)}</b>`, h`<b class="tab ${v.lucro < 0 ? "neg" : "pos"}">${brl(v.lucro)}</b><br><span class="tiny dim tab">${pc(v.margemPct, 1)}</span>`,
      canc ? h`<span class="chip">Cancelada</span>` : chipSaude(E.classificarSaude(v.lucro, v.margemPct, meta)),
      canc ? "" : h`<button type="button" class="btn xs danger" data-act="vendaCancelar" data-id="${v.id}">Cancelar venda</button>`] };
  });
  return h`<div class="grid g4">${kpi("Vendas", String(ativos.length), "no período")}${kpi("Faturamento", brl(fat), "receita bruta")}${kpi("Lucro líquido real", brl(lucro), fat > 0 ? `${pc((lucro / fat) * 100, 1)} do faturamento` : "", "", lucro < 0 ? "neg" : "")}${kpi("Ticket médio", brl(ativos.length ? fat / ativos.length : 0), "por venda")}</div>
    <section class="card"><header><h2>Vendas registradas</h2><span class="sub">cada venda mostra o lucro real depois de impostos, rateio e taxa da maquininha</span></header>
      ${vs.length ? rt({ cols: "minmax(0,1.7fr) 86px 110px 110px 110px 150px 130px", cab: ["Venda", "Data", "Pagamento", "Total", "Lucro líquido", "Situação", "Ações"], right: [3, 4], full: [6], linhas }) : vazio("calc", "Nenhuma venda no período", "Registre vendas na aba Preços: o simulador já calcula o lucro real.", h`<a class="btn gold" href="#precos">${ico("calc")}Abrir simulador</a>`)}
      ${vs.length > lim ? h`<div class="row" style="justify-content:center;margin-top:12px"><button type="button" class="btn" data-act="cxMais">Mostrar mais ${Math.min(40, vs.length - lim)}</button></div>` : ""}</section>`;
}

function viewCaixa() {
  const c = ui.caixa, per = periodoCaixa(), R = resumo(per);
  const catOpc = [["todas", "Todas as categorias"], ...Object.entries(CATS)];
  return h`<div class="wrap">
    ${cabecalho("Fluxo de caixa", "Proventos, despesas e a lucratividade real da loja.", h`<div class="row"><button type="button" class="btn gold" data-act="movNova">${ico("plus")}Nova movimentação</button><button type="button" class="btn" data-act="csvExportar">${ico("download")}Exportar CSV</button></div>`)}
    ${avisoDemo()}
    ${cartaoDRE(R, per)}
    <section class="card"><div class="col" style="gap:12px">
      <div class="row" style="justify-content:space-between">${segmento("Tipo de lista", [["lanc", "Lançamentos"], ["vendas", "Vendas"]], c.sub, "cxSub")}${segmento("Período", PER_CAIXA, c.periodo, "cxPeriodo")}</div>
      ${c.periodo === "custom" ? h`<div class="formgrid">${campo({ label: "De", bind: "caixa.de", valor: c.de, tipo: "date", dec: false, re: "full" })}${campo({ label: "Até", bind: "caixa.ate", valor: c.ate, tipo: "date", dec: false, re: "full" })}</div>` : ""}
      <div class="formgrid">
        ${c.sub === "lanc" ? h`${selecao({ label: "Tipo", bind: "caixa.tipo", valor: c.tipo, opcoes: [["todos", "Receitas e despesas"], ["receita", "Só receitas"], ["despesa", "Só despesas"]], re: "lista" })}
        ${selecao({ label: "Categoria", bind: "caixa.cat", valor: c.cat, opcoes: catOpc, re: "lista" })}
        ${selecao({ label: "Situação", bind: "caixa.status", valor: c.status, opcoes: [["todos", "Todas"], ["pago", "Pagas / recebidas"], ["pendente", "Pendentes"], ["vencido", "Vencidas"]], re: "lista" })}` : ""}
        ${campo({ label: "Buscar", bind: "caixa.busca", valor: c.busca, dec: false, re: "lista", ph: c.sub === "lanc" ? "Descrição…" : "Cliente, produto ou nº…" })}</div></div></section>
    <div id="cx-lista" class="col">${c.sub === "lanc" ? caixaLista() : caixaVendas()}</div></div>`;
}
function atualizarLista() {
  const el = $("#cx-lista"); if (!el || ui.tab !== "caixa") return;
  el.innerHTML = (ui.caixa.sub === "lanc" ? caixaLista() : caixaVendas()).toString();
}
REFRESH.lista = () => { ui.caixa.limite = 40; atualizarLista(); };

MODAIS.mov = (d) => ({
  titulo: "Nova movimentação",
  corpo: h`<div class="col" style="gap:12px">
    ${segmento("Tipo", [["despesa", "Despesa"], ["receita", "Receita"]], d.tipo, "movTipo")}
    <div class="formgrid">
      ${d.tipo === "despesa" ? selecao({ label: "Categoria", bind: "modal.dados.categoria", valor: d.categoria, opcoes: CATS_DESPESA.map((k) => [k, CATS[k]]) }) : h`<div class="field"><label>Categoria</label><div class="inp"><span style="font-weight:700">Outras receitas</span></div></div>`}
      ${campo({ label: "Valor", pre: "R$", bind: "modal.dados.valor", valor: d.valor })}
      ${campo({ label: d.tipo === "despesa" ? "Vencimento / data" : "Data", bind: "modal.dados.data", valor: d.data, tipo: "date", dec: false })}
      ${selecao({ label: "Situação", bind: "modal.dados.status", valor: d.status, opcoes: [["pendente", d.tipo === "despesa" ? "A pagar" : "A receber"], ["pago", d.tipo === "despesa" ? "Já paga" : "Já recebida"]] })}
      ${selecao({ label: "Forma", bind: "modal.dados.forma", valor: d.forma, opcoes: FORMAS_COMPRA })}
      ${campo({ label: "Repetir por quantos meses", bind: "modal.dados.repetir", valor: d.repetir, extra: 'inputmode="numeric"', dica: "1 = só uma vez. Útil para aluguel, internet, salários." })}</div>
    ${campo({ label: "Descrição", bind: "modal.dados.descricao", valor: d.descricao, dec: false, ph: d.tipo === "despesa" ? "Ex.: Aluguel da loja" : "Ex.: Venda de sucata" })}</div>`,
  rodape: h`<button type="button" class="btn" data-act="modalFechar">Cancelar</button><button type="button" class="btn gold" data-act="movSalvar">Salvar</button>`,
});

Object.assign(ACOES, {
  cxSub: (el) => { ui.caixa.sub = el.dataset.v; ui.caixa.limite = 40; render(); },
  cxMais: () => { ui.caixa.limite += 40; atualizarLista(); },
  cxPeriodo: (el) => { ui.caixa.periodo = el.dataset.v; ui.caixa.limite = 40; render(); },
  movNova: () => abrirModal("mov", { tipo: "despesa", categoria: "fixa", descricao: "", valor: "", data: hoje(), status: "pendente", forma: "pix", repetir: "1" }),
  movTipo: (el) => { const d = ui.modal.dados; d.tipo = el.dataset.v; d.categoria = d.tipo === "despesa" ? "fixa" : "outros"; renderModal(); },
  movSalvar: () => {
    const d = ui.modal.dados, valor = r2(num(d.valor)), n = Math.min(36, Math.max(1, Math.round(num(d.repetir) || 1)));
    if (!d.descricao.trim()) { toast("Escreva uma descrição.", "bad"); return; }
    if (!(valor > 0)) { toast("Informe um valor maior que zero.", "bad"); return; }
    if (!dataOk(d.data)) { toast("A data é inválida.", "bad"); return; }
    for (let i = 0; i < n; i++) {
      const data = addMeses(d.data, i), pago = d.status === "pago" && (n === 1 || data <= hoje());
      db.lanc.push({ id: uid(), tipo: d.tipo, categoria: d.tipo === "receita" ? "outros" : d.categoria, descricao: d.descricao.trim() + (n > 1 ? ` (${i + 1}/${n})` : ""), valor, data, status: pago ? "pago" : "pendente", pagoEm: pago ? (n === 1 ? d.data : data) : null, forma: d.forma });
    }
    fecharModal(); commit(); toast(n > 1 ? `${n} lançamentos criados.` : "Lançamento salvo.", "ok");
  },
  lancBaixa: (el) => { const l = db.lanc.find((x) => x.id === el.dataset.id); if (l) { l.status = "pago"; l.pagoEm = hoje(); commit(); toast(l.tipo === "receita" ? "Recebimento registrado." : "Pagamento registrado.", "ok"); } },
  lancReabrir: (el) => { const l = db.lanc.find((x) => x.id === el.dataset.id); if (l) { l.status = "pendente"; l.pagoEm = null; commit(); } },
  lancDel: (el) => { const id = el.dataset.id, l = db.lanc.find((x) => x.id === id); if (!l) return; confirmar({ titulo: "Excluir lançamento?", texto: `“${l.descricao}” (${brl(l.valor)}) será removido do caixa.${l.notaId ? " O estoque da nota não é alterado." : ""}`, ok: "Excluir", perigo: true, aoConfirmar: () => { db.lanc = db.lanc.filter((x) => x.id !== id); commit(); toast("Lançamento excluído."); } }); },
  vendaCancelar: (el) => { const id = el.dataset.id, v = db.vendas.find((x) => x.id === id); if (!v) return; confirmar({ titulo: `Cancelar a venda #${v.numero}?`, texto: "Os recebimentos dela saem do caixa, o produto volta para o estoque e a entrega (se houver) é removida.", ok: "Cancelar venda", perigo: true, aoConfirmar: () => { cancelarVenda(id); commit(); toast(`Venda #${v.numero} cancelada.`); } }); },
  csvExportar: () => { const ls = lancFiltrados(); if (!ls.length) { toast("Não há lançamentos nesses filtros para exportar.", "bad"); return; } entregarArquivo(`midas-fluxo-de-caixa-${hoje()}.csv`, csvCaixa(ls), "text/csv;charset=utf-8", "Relatório CSV"); },
});

/* ═══════════════ Aba 5 · Estoque & logística ═══════════════ */
const ORIGEM_TXT = { nota_fiscal: "Nota fiscal", venda: "Venda", manual: "Manual", inventario: "Contagem", cancelamento: "Cancelamento" };
const ESTOQUE_SUB = [["produtos", "Produtos"], ["entregas", "Entregas"], ["mov", "Movimentações"]];

function estProdutos() {
  const e = ui.estoque, q = norm(e.busca);
  const ativos = db.produtos.filter((p) => p.ativo);
  const baixos = ativos.filter((p) => p.estoque > 0 && p.estoque <= p.minimo), zerados = ativos.filter((p) => p.estoque <= 0);
  const valor = r2(ativos.reduce((s, p) => s + Math.max(p.estoque, 0) * custoTotal(p), 0));
  let lista = db.produtos.filter((p) => (e.filtro === "inativos" ? !p.ativo : p.ativo) && (!q || norm(`${p.sku} ${p.nome}`).includes(q)));
  if (e.filtro === "alerta") lista = lista.filter((p) => statusEstoque(p) !== "ok");
  lista.sort((a, b) => { const o = { zerado: 0, baixo: 1, ok: 2 }; return o[statusEstoque(a)] - o[statusEstoque(b)] || a.nome.localeCompare(b.nome, "pt-BR"); });
  const linhas = lista.map((p) => {
    const st = statusEstoque(p), cob = cobertura(p), s30 = saidas30(p.id);
    const chip = !p.ativo ? h`<span class="chip">Inativo</span>` : st === "zerado" ? h`<span class="chip bad">${ico("xcircle")}Sem estoque</span>` : st === "baixo" ? h`<span class="chip warn">${ico("alert")}Abaixo do mínimo</span>` : h`<span class="chip ok">${ico("check")}Ok</span>`;
    return { cels: [
      h`<span class="strong nm">${p.nome}</span><br><span class="tiny dim">${p.sku}${p.ncm ? " · NCM " + p.ncm : ""}</span>`,
      h`<b class="tab ${st === "ok" ? "" : "neg"}">${nf(p.estoque)}</b> <span class="tiny dim">${p.un}</span>`, nf(p.minimo),
      cob == null ? h`<span class="dim">sem vendas</span>` : h`<b class="tab ${cob < 10 ? "neg" : ""}">${nf(cob, 0)} dias</b><br><span class="tiny dim">${nf(s30)} ${p.un} em 30 dias</span>`,
      brl(custoTotal(p)), brl(p.preco), chip,
      h`<div class="acoes"><button type="button" class="btn xs" data-act="estSimular" data-id="${p.id}">${ico("calc")}Preço</button><button type="button" class="btn xs" data-act="estAjustar" data-id="${p.id}">Contagem</button><button type="button" class="btn xs" data-act="prodEditar" data-id="${p.id}" aria-label="Editar ${p.nome}">${ico("edit")}</button></div>`] };
  });
  return h`<div class="grid g4">
      ${kpi("Produtos ativos", String(ativos.length), "cadastrados")}${kpi("Valor em estoque", brl(valor), "a preço de custo")}
      ${kpi("Abaixo do mínimo", String(baixos.length), baixos.length ? baixos.slice(0, 2).map((p) => p.nome).join(", ") + (baixos.length > 2 ? "…" : "") : "tudo certo", "", baixos.length ? "neg" : "")}
      ${kpi("Sem estoque", String(zerados.length), zerados.length ? zerados.slice(0, 2).map((p) => p.nome).join(", ") : "nenhum", "", zerados.length ? "neg" : "")}</div>
    <section class="card"><div class="formgrid">${campo({ label: "Buscar produto", bind: "estoque.busca", valor: e.busca, dec: false, re: "estLista", ph: "Nome ou SKU…" })}
      ${selecao({ label: "Mostrar", bind: "estoque.filtro", valor: e.filtro, opcoes: [["todos", "Todos os ativos"], ["alerta", "Só com alerta"], ["inativos", "Inativos"]], re: "estLista" })}</div></section>
    <section class="card"><header><h2>Produtos e giro</h2><span class="sub">cobertura = estoque ÷ média diária de saídas dos últimos 30 dias</span></header>
      ${lista.length ? rt({ cols: "minmax(0,1.8fr) 90px 70px 110px 100px 100px 150px", cab: ["Produto", "Estoque", "Mínimo", "Cobertura", "Custo médio", "Preço", "Situação", "Ações"], right: [1, 2, 3, 4, 5], full: [7], span: [7], linhas }) : vazio("box", db.produtos.length ? "Nenhum produto nesse filtro" : "Nenhum produto ainda", db.produtos.length ? "Mude a busca ou o filtro." : "Os produtos nascem das notas de compra. Você também pode cadastrar à mão.", h`<button type="button" class="btn gold" data-act="prodNovo">${ico("plus")}Cadastrar produto</button>`)}</section>`;
}

function dias(e) { const n = Math.round((parseYmd(hoje()) - parseYmd(e.criadoEm.slice(0, 10))) / 86400000); return n <= 0 ? "hoje" : n === 1 ? "ontem" : `há ${n} dias`; }
function estEntregas() {
  const cols = [["separacao", "Em separação", "rota"], ["rota", "Em rota", "entregue"], ["entregue", "Entregue", null]];
  const ordem = ["separacao", "rota", "entregue"];
  return h`<div class="kan">${cols.map(([st, rot, prox]) => {
    const itens = db.entregas.filter((x) => x.status === st).sort((a, b) => (a.criadoEm < b.criadoEm ? 1 : -1)).slice(0, st === "entregue" ? 12 : 100);

/* ═══════════════ MIDAS · instalar no Android, iPhone/iPad, Chrome e Edge · QR code · publicar ═══════════════
   Detecta o aparelho e mostra o passo a passo certo; usa o botão nativo de instalar quando o navegador oferece.
   Também gera QR code + mensagem de WhatsApp para o consultor mandar o MIDAS aos clientes. */
const CHAVE_INST = "midas.instalar", CHAVE_LINK = "midas.link";
const NOMES_SO = { ios: "iPhone/iPad", android: "Android", desktop: "Computador" };
const NOMES_NAV = { safari: "Safari", chrome: "Chrome", edge: "Edge", firefox: "Firefox", samsung: "Samsung Internet", opera: "Opera", outro: "navegador" };

const jaInstalado = () => {
  try { return (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: window-controls-overlay)").matches)) || navigator.standalone === true; }
  catch (e) { return false; }
};

/* Descobre sistema e navegador pelo user-agent (recebe o texto para poder ser testado). */
function detectarAparelho(ua = navigator.userAgent || "", toques = navigator.maxTouchPoints || 0) {
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && toques > 1); // iPadOS se apresenta como Mac
  const android = /Android/i.test(ua);
  const so = ios ? "ios" : android ? "android" : "desktop";
  let nav = "outro";
  if (/EdgiOS|EdgA|Edg\//.test(ua)) nav = "edge";
  else if (/OPR\/|OPiOS|Opera/.test(ua)) nav = "opera";
  else if (/SamsungBrowser/.test(ua)) nav = "samsung";
  else if (/Firefox|FxiOS/.test(ua)) nav = "firefox";
  else if (/CriOS|Chrome\//.test(ua)) nav = "chrome";
  else if (/Safari\//.test(ua)) nav = "safari";
  // navegador interno de outro app (Instagram, Facebook, TikTok...) e WebViews: não instalam
  let embutido = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|musical_ly|BytedanceWebview|Snapchat|Twitter|LinkedInApp|Pinterest|; wv\)/i.test(ua);
  if (ios && !/Safari|CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) embutido = true; // WKWebView de outro app
  return { so, nav, embutido };
}
const ambienteInstalar = () => ({
  claude: emClaude(),
  instalado: ui.instalado || jaInstalado(),
  hospedar: !(window.isSecureContext && /^https?:$/.test(location.protocol)), // file:// ou http sem https: o navegador não deixa instalar
});
const mostrarBotaoInstalar = () => { const a = ambienteInstalar(); return !a.claude && !a.instalado; };

/* ── endereço publicado (para QR e mensagem) ── */
function urlAtual() {
  if (emClaude() || location.protocol !== "https:") return "";
  return location.origin + location.pathname.replace(/index\.html$/, "");
}
const linkSalvo = () => lerStorage(CHAVE_LINK) || "";
const urlPublicada = () => urlAtual() || linkSalvo();
function normalizarLink(txt) {
  let u = String(txt || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  if (!/^https:\/\/[^\s/.]+\.[^\s]+$/i.test(u)) return "";
  return u.replace(/#.*$/, "");
}
function mensagemInstalar(url) {
  return `Olá! Instale o MIDAS no seu celular ou computador (gestão financeira, estoque e preços da sua loja):\n${url}\n\n` +
    `📱 Android: abra o link no Chrome, toque nos 3 pontinhos (⋮) e em “Instalar app”.\n` +
    `🍎 iPhone: abra o link no Safari, toque em Compartilhar e em “Adicionar à Tela de Início”.\n` +
    `💻 Computador: abra no Chrome ou Edge e clique no ícone de instalar, no fim da barra de endereço.`;
}

/* ── QR code em SVG (módulos escuros sobre fundo branco, com margem) ── */
function qrSvg(texto) {
  const m = window.MidasQR(texto), n = m.length, b = 3;
  let d = "";
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      if (!m[y][x]) continue;
      let w = 1; while (x + w < n && m[y][x + w]) w++;
      d += `M${x + b} ${y + b}h${w}v1h-${w}z`; x += w - 1;
    }
  }
  const t = n + b * 2;
  return raw(`<svg viewBox="0 0 ${t} ${t}" role="img" aria-label="QR code com o endereço do MIDAS" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#ffffff"/><path d="${d}" fill="#141c2e"/></svg>`);
}

/* ── passo a passo por aparelho ── */
const passo = (ic, t, d) => ({ ic, t, d });
function guiaInstalar(alvo, nav) {
  if (alvo === "ios") {
    return {
      passos: [
        passo("share", "Toque em Compartilhar", h`É o ícone de um quadrado com uma seta para cima. No Safari do iPhone fica na <b>barra de baixo</b>; no iPad, no topo. No Chrome e no Edge do iPhone, fica ao lado do endereço ou no menu (⋯).`),
        passo("addsq", "Escolha “Adicionar à Tela de Início”", h`Role a lista para baixo até encontrar a opção (ela tem um quadradinho com um +).`),
        passo("check", "Toque em “Adicionar”", h`O ícone do MIDAS aparece na tela inicial. <b>Abra sempre por ele</b>: assim o app abre em tela cheia e funciona até sem internet.`),
      ],
      dica: h`<b>Importante no iPhone:</b> o app da Tela de Início guarda os dados separados do Safari. Instale <b>antes</b> de lançar as vendas, ou leve o que já tem pelo backup (Configurações). ${nav !== "safari" ? "Se a opção não aparecer neste navegador, abra o mesmo link no Safari." : ""}`,
    };
  }
  if (alvo === "android") {
    const menu = {
      chrome: [passo("dots", "Abra o menu do Chrome (⋮)", h`São os três pontinhos, no canto de cima da tela.`), passo("download", "Toque em “Instalar app”", h`Em algumas versões aparece como “Adicionar à tela inicial”. Se aparecerem as duas, escolha <b>Instalar</b>.`)],
      samsung: [passo("dots", "Abra o menu (☰)", h`São as três linhas, na barra de baixo do Samsung Internet.`), passo("addsq", "Toque em “Adicionar página a” e depois em “Tela inicial”", h`O MIDAS vira um ícone na tela inicial.`)],
      edge: [passo("dots", "Abra o menu do Edge (⋯)", h`Na barra de baixo da tela.`), passo("download", "Toque em “Adicionar ao telefone”", h`Em algumas versões aparece como “Instalar”.`)],
      firefox: [passo("dots", "Abra o menu do Firefox (⋮)", h`Os três pontinhos, no canto de cima.`), passo("download", "Toque em “Instalar”", h`Se não aparecer, abra o link no Chrome.`)],
    };
    const m = menu[nav] || menu.chrome;
    return {
      passos: [...m, passo("check", "Confirme em “Instalar”", h`O MIDAS vira um ícone na tela inicial, abre em tela cheia e funciona até sem internet.`)],
      dica: h`Se a opção de instalar não aparecer, abra o link no <b>Chrome</b>. Navegadores dentro de outros apps (Instagram, Facebook, WhatsApp) não instalam.`,
    };
  }
  // computador
  if (nav === "safari") {
    return { passos: [passo("share", "No menu Arquivo, escolha “Adicionar ao Dock…”", h`Funciona no Safari do macOS Sonoma ou mais novo.`), passo("check", "Confirme em “Adicionar”", h`O MIDAS fica no Dock e abre numa janela própria.`)], dica: h`Para o Windows, use o <b>Chrome</b> ou o <b>Edge</b>.` };
  }
  if (nav === "firefox") {
    return { passos: [passo("globe", "Abra este mesmo endereço no Chrome ou no Edge", h`O Firefox no computador pode não oferecer a instalação de aplicativos. No Chrome e no Edge, o passo a passo é rápido.`)], dica: "" };
  }
  const edge = nav === "edge";
  return {
    passos: [
      passo("installpc", "Procure o ícone de instalar na barra de endereço", h`Fica no <b>lado direito do endereço</b>: um monitor com uma seta para baixo (ou um sinal de +). Clique nele.`),
      passo("download", "Clique em “Instalar”", h`O MIDAS abre numa janela própria, sem as barras do navegador, e ganha atalho na área de trabalho ou no menu Iniciar.`),
      passo("check", "Fixe na barra de tarefas (opcional)", h`No Windows: botão direito no ícone do MIDAS na barra → <b>Fixar na barra de tarefas</b>. No Mac, deixe o ícone no Dock.`),
    ],
    dica: edge
      ? h`Sem o ícone? No Edge: menu <b>⋯</b> → <b>Aplicativos</b> → <b>Instalar este site como um aplicativo</b>. O nome do menu pode variar um pouco conforme a versão.`
      : h`Sem o ícone? No Chrome: menu <b>⋮</b> → <b>Transmitir, salvar e compartilhar</b> → <b>Instalar página como app</b> (o nome pode variar conforme a versão). O Edge também instala, em ⋯ → Aplicativos.`,
  };
}

/* ── modal: instalar ── */
MODAIS.instalar = (d) => {

      ${amb.hospedar ? h`<div class="notice">${ico("info")}<p>O MIDAS está aberto direto do arquivo, e o navegador só instala apps que estejam num endereço <b>https</b>. Publique a pasta <b>pwa</b> uma vez (é grátis e leva uns 5 minutos) e abra o endereço novo.</p><button type="button" class="btn sm gold" data-act="abrirPublicar">Como publicar</button></div>` : ""}

let ultimaTab = null, ignorarHash = false;

function render() {
  const y = window.scrollY, mesma = ultimaTab === ui.tab;
  renderCasca();
  try { $("#main").innerHTML = VIEWS[ui.tab]().toString(); }
  catch (err) {
    console.error(err);
    $("#main").innerHTML = `<div class="wrap"><div class="notice bad"><p><b>Algo deu errado nesta tela.</b> Seus dados estão salvos. Volte ao Dashboard; se continuar, baixe um backup em Configurações e avise o suporte. (${esc(err && err.message)})</p></div><div class="row"><a class="btn gold" href="#dash">Ir para o Dashboard</a><a class="btn" href="#config">Configurações</a></div></div>`;
  }
  ultimaTab = ui.tab;
  window.scrollTo(0, mesma ? y : 0);
}
function tabDoHash() { const t = (location.hash || "").replace(/^#/, ""); return TELAS.includes(t) ? t : "dash"; }
function navegar(tab) {
  ui.tab = TELAS.includes(tab) ? tab : "dash";
  render();
  try { if (location.hash !== "#" + ui.tab) { ignorarHash = true; location.hash = "#" + ui.tab; } } catch (e) { /* sem hash */ }
}
REFRESH.full = () => render();

  if (el) {
    const f = ACOES[el.dataset.act];
    if (f) { try { const r = f(el, ev); if (r && r.catch) r.catch((e) => { console.error(e); toast("Algo deu errado. Tente de novo.", "bad"); }); } catch (e) { console.error(e); toast("Algo deu errado. Tente de novo.", "bad"); } }
    return;
  }
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (t) mostrarTip(t, ev); else esconderTip();
});
function onCampo(ev) {
  const el = ev.target.closest && ev.target.closest("[data-bind]"); if (!el) return;
  const tipo = el.type, select = el.tagName === "SELECT", marca = tipo === "checkbox", data = tipo === "date";
  if (ev.type === "input" && (select || marca)) return;
  if (ev.type === "change" && !(select || marca || data)) return;
  let val = marca ? el.checked : el.value;
  if (el.dataset.num) val = Math.min(100000, Math.max(0, num(val)));
  setPath(el.dataset.bind, val);
  const re = el.dataset.re || "none", f = REFRESH[re];
  if (f) f(el);
}
document.addEventListener("input", onCampo);
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el && el.matches && el.matches("input[type=file][data-file]")) {
    const lista = Array.from(el.files || []), f = ARQUIVOS[el.dataset.file]; el.value = "";
    if (f && lista.length) f(lista);
    return;
  }
  onCampo(ev);
});
document.addEventListener("dragover", (ev) => { const d = ev.target.closest && ev.target.closest("[data-drop]"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (ev) => { const d = ev.target.closest && ev.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (ev) => {
  const d = ev.target.closest && ev.target.closest("[data-drop]"); if (!d) return;
  ev.preventDefault(); d.classList.remove("over");
  const f = ARQUIVOS[d.dataset.drop], lista = Array.from((ev.dataTransfer && ev.dataTransfer.files) || []);
  if (f && lista.length) f(lista);
});
document.addEventListener("mousemove", (ev) => {
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (t) mostrarTip(t, ev); else if (!$("#tip").hidden) esconderTip();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && ui.modal) fecharModal(); });
window.addEventListener("hashchange", () => {
  if (ignorarHash) { ignorarHash = false; return; }
  ui.tab = tabDoHash(); render();
});

/* ── instalação (Chrome/Edge) ── */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); ui.instalar = e; if (!ui.modal) render(); else if (ui.modal.id === "instalar") renderModal(); });
window.addEventListener("appinstalled", () => { ui.instalar = null; ui.instalado = true; toast("MIDAS instalado!", "ok"); if (ui.modal && ui.modal.id === "instalar") renderModal(); render(); });

/* ── tema automático: acompanha o aparelho em tempo real ── */
try {
  const mq = window.matchMedia("(prefers-color-scheme: dark)"), seguir = () => { if (tema === "auto") { aplicarTema("auto"); render(); } };
  if (mq.addEventListener) mq.addEventListener("change", seguir); else if (mq.addListener) mq.addListener(seguir);
} catch (e) { /* sem matchMedia */ }

/* ── várias abas/janelas abertas: mantém os dados em dia ── */
window.addEventListener("storage", (e) => {
  if (e.key !== CHAVE || !e.newValue) return;
  try { db = migrar(JSON.parse(e.newValue)); if (!ui.modal && !ui.notas.rascunho) render(); } catch (err) { /* ignora */ }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && liquidarRecebimentos()) commit(); });
let timerResize = null, largAnt = larguraChart();
window.addEventListener("resize", () => {
  clearTimeout(timerResize);
  timerResize = setTimeout(() => { const w = larguraChart(); if (w !== largAnt) { largAnt = w; if (!ui.modal && (ui.tab === "dash" || ui.tab === "precos")) render(); } }, 200);
});

/* ── início ── */
(function iniciar() {
  aoMudarDefinir(() => render());
  aplicarTema(lerStorage(CHAVE_TEMA) || "claro");
  db = carregarDB();
  if (!db) { semearDemo(); salvarDB(); }
  if (liquidarRecebimentos()) salvarDB();
  ui.tab = tabDoHash();
  render();
  iniciarIA();
})();


</script>
