/* MIDAS — identidade: grafite/azul petróleo + dourado/âmbar. Layout: barra lateral no PC, abas embaixo no celular.
   Tema claro por padrão (papel quente, sem branco puro, texto em grafite suave) para ficar confortável aos olhos;
   o escuro é opcional (Configurações → Aparência) e "Automático" segue o aparelho.
   O tema é controlado pelo próprio app (atributo data-tema na raiz), não pelo tema do site que hospeda a página. */
:root {
  --bg: #f2f0ea;
  --chrome: #faf9f6;
  --panel: #fdfcfa;
  --panel-2: #fbfaf7;
  --inset: #f4f2ec;
  --hover: #ebe8df;
  --line: #e2ded3;
  --line-2: #cfcabb;
  --fg: #2a3345;
  --fg-strong: #141c2e;
  --muted: #55607a;
  --dim: #5e6980;
  --gold: #f59e0b;
  --gold-hi: #fbbf24;
  --gold-lo: #d97706;
  --gold-ink: #9a4a06;
  --gold-text: #7c3a05;
  --on-gold: #1a1204;
  --ok: #047857;
  --ok-bg: rgba(16, 185, 129, 0.12);
  --ok-line: rgba(5, 150, 105, 0.38);
  --warn: #855106;
  --warn-bg: rgba(234, 179, 8, 0.16);
  --warn-line: rgba(161, 98, 7, 0.4);
  --bad: #be123c;
  --bad-bg: rgba(244, 63, 94, 0.09);
  --bad-line: rgba(225, 29, 72, 0.38);
  --s1: #2f6fc8; /* série 1 (azul)   — validada contra o fundo claro dos cartões */
  --s2: #c4531f; /* série 2 (laranja) — validada contra o fundo claro dos cartões */
  --t-bad: #e11d48;
  --t-warn: #ca8a04;
  --t-ok: #059669;
  --ptr: #141c2e;
  --brand-1: #c2650a;
  --brand-2: #a8560a;
  --brand-3: #8f4506;
  --shadow: 0 8px 24px rgba(52, 44, 26, .18);
  --shadow-sm: 0 1px 2px rgba(52, 44, 26, .06);
  --scrim: rgba(36, 42, 56, .45);
  --radius: 14px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --bg: #060b16;
  --chrome: #0a1222;
  --panel: #0f172a;
  --panel-2: #131d33;
  --inset: #0a1222;
  --hover: #131d33;
  --line: #1c2842;
  --line-2: #2a3857;
  --fg: #e2e8f0;
  --fg-strong: #ffffff;
  --muted: #94a3b8;
  --dim: #7b8aa3;
  --gold: #f59e0b;
  --gold-hi: #fbbf24;
  --gold-lo: #d97706;
  --gold-ink: #fbbf24;
  --gold-text: #fcd34d;
  --on-gold: #0b1020;
  --ok: #34d399;
  --ok-bg: rgba(16, 185, 129, 0.1);
  --ok-line: rgba(16, 185, 129, 0.4);
  --warn: #facc15;
  --warn-bg: rgba(234, 179, 8, 0.1);
  --warn-line: rgba(234, 179, 8, 0.4);
  --bad: #fb7185;
  --bad-bg: rgba(244, 63, 94, 0.1);
  --bad-line: rgba(244, 63, 94, 0.45);
  --s1: #3987e5; /* série 1 (azul)   — validada contra #131d33 */
  --s2: #d95926; /* série 2 (laranja) — validada contra #131d33 */
  --t-bad: #f43f5e;
  --t-warn: #eab308;
  --t-ok: #10b981;
  --ptr: #ffffff;
  --brand-1: #fcd34d;
  --brand-2: #f59e0b;
  --brand-3: #d97706;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  --shadow-sm: none;
  --scrim: rgba(2, 6, 14, .72);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-tema="auto"] {
  --bg: #060b16;
  --chrome: #0a1222;

  --warn: #facc15;

  --brand-2: #f59e0b;
  --brand-3: #d97706;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  --shadow-sm: none;
  --scrim: rgba(2, 6, 14, .72);
  color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.tab { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gold-ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

/* ───────── casca ───────── */
.side {
  position: fixed; inset: 0 auto 0 0; width: 256px; display: none; flex-direction: column;
  background: var(--chrome); border-right: 1px solid var(--line); padding: 22px 12px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand img, .brand svg { width: 42px; height: 42px; flex: none; }
.brand b { display: block; font-size: 24px; font-weight: 800; letter-spacing: .05em; line-height: 1;
  background: linear-gradient(var(--brand-1), var(--brand-2) 55%, var(--brand-3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; margin-top: 5px; font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.side nav { margin-top: 26px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.side a, .bottom a {
  display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--muted);
  border-radius: 12px; padding: 11px 12px; font-weight: 600; cursor: pointer; min-height: 44px;
}
.side a:hover { background: var(--hover); color: var(--fg-strong); }
.side a[aria-current="page"] { background: rgba(245, 158, 11, .16); color: var(--gold-ink); box-shadow: inset 0 0 0 1px rgba(245, 158, 11, .3); }
.side a .core { margin-left: auto; font-size: 9px; font-weight: 800; text-transform: uppercase; background: var(--gold); color: var(--on-gold); border-radius: 99px; padding: 2px 6px; }
.side .foot { font-size: 11px; color: var(--dim); padding: 10px 8px 0; border-top: 1px solid var(--line); }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 var(--gutter-r) 0 var(--gutter); background: var(--chrome); border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--chrome); }
.top .brand img, .top .brand svg { width: 34px; height: 34px; }
.top .brand b { font-size: 20px; }
.top .tools { display: flex; align-items: center; gap: 6px; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: none; border: 0; color: var(--muted); cursor: pointer; }
.iconbtn:hover { background: var(--hover); color: var(--fg-strong); }
.iconbtn[aria-current="page"] { color: var(--gold-ink); }

main { padding: 16px var(--gutter-r) 108px var(--gutter); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.bottom {
  position: fixed; inset: auto 0 0 0; z-index: 30; background: var(--chrome); border-top: 1px solid var(--line);
  padding: 0 var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter);
}
.bottom ul { list-style: none; margin: 0 auto; padding: 0; max-width: 560px; display: grid; grid-template-columns: repeat(5, 1fr); }
.bottom a { flex-direction: column; gap: 2px; padding: 6px 0; font-size: 11px; justify-content: center; min-height: 58px; }
.bottom a[aria-current="page"] { color: var(--gold-ink); }
.bottom a .pill { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 99px; background: var(--gold); color: var(--on-gold); }
.bottom a .pill .ico { width: 20px; height: 20px; }

@media (min-width: 1024px) {
  .side { display: flex; }
  .top, .bottom, body::before { display: none; }
  main { padding: 28px 32px 40px 288px; }
}

/* ───────── blocos ───────── */
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.pagehead h1 { font-size: 24px; font-weight: 800; color: var(--fg-strong); letter-spacing: -.01em; }
.pagehead p { color: var(--muted); margin-top: 2px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; box-shadow: var(--shadow-sm); }
.card > header { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: baseline; }
.card h2 { font-size: 14px; font-weight: 700; color: var(--fg-strong); }
.card .sub { font-size: 12px; color: var(--muted); }
.inset { background: var(--inset); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; min-width: 0; }
.grid { display: grid; gap: 12px; min-width: 0; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px) { .g4 { grid-template-columns: repeat(4, 1fr); } }
.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1024px) { .split { grid-template-columns: 380px minmax(0, 1fr); } .split.wide { grid-template-columns: minmax(0, 1fr) 380px; } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sp { flex: 1; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .strong { color: var(--fg-strong); font-weight: 700; }
.small { font-size: 12px; } .tiny { font-size: 11px; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }

.kpi { background: var(--inset); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 22px; font-weight: 800; color: var(--fg-strong); margin-top: 2px; overflow-wrap: anywhere; }
.kpi .d { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.kpi.big .v { font-size: 26px; }

/* botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-2); background: var(--inset); color: var(--fg); font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--panel); border-color: var(--dim); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.gold:hover { background: var(--gold-hi); }
.btn.danger { border-color: var(--bad-line); color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.lg { min-height: 52px; font-size: 16px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn .ico { width: 18px; height: 18px; }
.linkbtn { background: none; border: 0; color: var(--gold-ink); text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }

.seg { display: inline-flex; background: var(--inset); border: 1px solid var(--line-2); border-radius: 12px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { min-height: 38px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 700; cursor: pointer; white-space: nowrap; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }

/* campos */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.inp { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; background: var(--inset); border: 1px solid var(--line-2); border-radius: 12px; min-width: 0; }
.inp:focus-within { border-color: var(--gold-lo); box-shadow: 0 0 0 1px var(--gold-lo); }
.inp input, .inp select { flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; outline: 0; font-weight: 700; color: var(--fg-strong); padding: 0; min-height: 42px; }
.inp .u { color: var(--dim); font-weight: 600; flex: none; }
.inp.lg { min-height: 56px; } .inp.lg input { font-size: 20px; min-height: 54px; }
.inp select { appearance: none; -webkit-appearance: none; }
.inp select option { background: var(--panel); color: var(--fg); }
textarea.inp { padding: 10px 12px; width: 100%; min-height: 90px; display: block; font-weight: 500; resize: vertical; }
.hint { font-size: 11.5px; color: var(--dim); }
.formgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* pagamento */
.pay { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pay button, .parc button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; cursor: pointer;
  background: var(--inset); border: 1px solid var(--line-2); color: var(--fg); font-weight: 700; font-size: 12px; min-height: 64px;
}
.pay button[aria-checked="true"], .parc button[aria-checked="true"] { border-color: var(--gold); background: rgba(245, 158, 11, .16); color: var(--gold-ink); }
.parc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
@media (min-width: 520px) { .parc { grid-template-columns: repeat(6, 1fr); } }
.parc button { min-height: 50px; font-size: 14px; border-radius: 10px; }
.parc button small { font-size: 10.5px; color: var(--dim); font-weight: 600; }

/* status */
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip .ico { width: 15px; height: 15px; }
.chip.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.chip.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }
.chip.gold { color: var(--gold-text); background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .4); }

.thermo { border-radius: 16px; border: 2px solid var(--line-2); padding: 18px; }
.thermo.saudavel { border-color: var(--ok-line); background: var(--ok-bg); }
.thermo.atencao { border-color: var(--warn-line); background: var(--warn-bg); }
.thermo.prejuizo { border-color: var(--bad-line); background: var(--bad-bg); }
.thermo .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.thermo .big { font-size: clamp(34px, 8vw, 48px); font-weight: 800; line-height: 1.05; margin-top: 10px; overflow-wrap: anywhere; }
.thermo .big small { font-size: 14px; font-weight: 600; color: var(--muted); display: block; margin-top: 4px; }
.thermo.saudavel .big { color: var(--ok); } .thermo.atencao .big { color: var(--warn); } .thermo.prejuizo .big { color: var(--bad); }
.bar { position: relative; height: 16px; border-radius: 99px; margin-top: 18px; }
.bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--panel-2); }
.bar b { position: absolute; top: -6px; width: 6px; height: 28px; margin-left: -3px; border-radius: 99px; background: var(--ptr); box-shadow: 0 0 0 2px var(--panel-2); transition: left .2s; }
.barlbl { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stickyth { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 20; background: var(--chrome); border-block: 1px solid var(--line-2); margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter)); padding: 8px var(--gutter-r) 10px var(--gutter); }
@media (min-width: 1024px) { .stickyth { display: none; } }

/**
 * Motor de precificação do MIDAS — funções puras, sem React e sem Supabase.
 *
 * Modelo (tudo por unidade; percentuais incidem sobre o PREÇO FINAL de venda):
 *
 *   C   = custo da NF + frete + impostos de entrada
 *   t   = imposto de saída (%)
 *   f   = rateio de custo fixo (%)
 *   c   = taxa da operadora para a condição escolhida (%)
 *   Pf  = preço final (preço de tabela − desconto)
 *
 *   Lucro bruto       = Pf − Pf·t − C
 *   Lucro operacional = Lucro bruto − Pf·f
 *   Lucro líquido real= Lucro operacional − Pf·c
 *
 *   Markup divisor    = 1 − (t + f + c + margem)
 *   Preço sugerido    = C / divisor            (multiplicador = 1 / divisor)
 *   Preço mínimo para margem m: Pmin(m) = C / (1 − t − f − c − m)
 *   Desconto máximo   = P − Pmin(m)

// ───────────────────────── utilidades numéricas ─────────────────────────
const EPS = 1e-9;
function clamp(n, min, max) {

}
/** Arredonda para centavos (meio para longe do zero) e elimina -0. */

}
/** Arredonda para cima em centavos (nunca cobra menos do que o necessário). */
function ceil2(n) {

// ───────────────────────── custo e taxas ─────────────────────────
function custoTotalUnitario(c) {

}
function normalizarCondicao(p) {

    }

}
function rotuloCondicao(p) {

/** Taxa (%) da condição. PIX/dinheiro não têm taxa; débito/crédito vêm da tabela do lojista. */
function taxaDaCondicao(pagamento, taxas) {

        return { taxaPct: 0, encontrada: true };
    const linha = taxas.find((t) => t.forma === p.forma && t.parcelas === p.parcelas);

function precoMinimo(custoTotal, prem, taxaPct, margemPct) {

    const pct = Math.min(100, floor2((valor / precoTabela) * 100));

 * Desconto máximo por unidade para uma condição de pagamento.
 * Sempre truncado para baixo: aplicar o valor mostrado jamais cria prejuízo.

function descontoMaximo(precoTabela, custoTotal, prem, taxaPct) {

    const pMeta = precoMinimo(custoTotal, prem, taxaPct, Math.max(0, prem.margemAlvoPct));
    const eq = descontoAte(precoTabela, pEquilibrio);
    const meta = descontoAte(precoTabela, pMeta);

        semPrejuizoPct: eq.pct,
        semPrejuizoValorUnit: eq.valor,
        mantendoMetaPct: meta.pct,

function simular(input) {

    let precoFinalUnit;
    if (input.desconto.tipo === "percentual") {

        precoFinalUnit = ceil2(precoTabela * (1 - pct / 100));

    else {
        const valor = clamp(r2(finito(input.desconto.valor)), 0, precoTabela);

    const f = finito(prem.custosFixosPct) / 100;

    const lucroBrutoUnit = precoFinalUnit - impostosSaidaUnit - custoTotalUnit;
    const rateioFixoUnit = precoFinalUnit * f;
    const lucroOperacionalUnit = lucroBrutoUnit - rateioFixoUnit;

    const lucroLiquidoUnit = lucroOperacionalUnit - taxaOperadoraUnit;
    const pctDoPreco = (v) => (precoFinalUnit > 0 ? (v / precoFinalUnit) * 100 : 0);
    const margemBrutaPct = pctDoPreco(lucroBrutoUnit);
    const margemOperacionalPct = pctDoPreco(lucroOperacionalUnit);
    const margemLiquidaPct = pctDoPreco(lucroLiquidoUnit);
    const markup = calcularMarkup(custoTotalUnit, prem, taxaPct);
    if (!markup.viavel) {
        avisos.push("Impostos + custo fixo + taxa + margem-alvo somam 100% ou mais: nenhum preço atinge a meta. Revise as premissas.");
    }
    if (custoTotalUnit <= 0)
        avisos.push("Produto sem custo cadastrado — dê entrada da NF ou informe o custo.");
    if (precoTabela <= 0)
        avisos.push("Informe o preço de tabela para simular.");
    const status = classificarSaude(lucroLiquidoUnit, margemLiquidaPct, prem.margemAlvoPct);
    const termo = termometro(margemLiquidaPct, prem.margemAlvoPct);
    const pEquilibrio = precoMinimo(custoTotalUnit, prem, taxaPct, 0);
    const pMeta = precoMinimo(custoTotalUnit, prem, taxaPct, Math.max(0, prem.margemAlvoPct));
    const rotulo = rotuloCondicao(pagamento);
    let mensagem;
    if (status === "prejuizo") {
        mensagem = Number.isFinite(pEquilibrio)
            ? `Você perde ${formatBRL(-lucroLiquidoUnit)} por unidade no ${rotulo}. O preço final precisa ser de pelo menos ${formatBRL(ceil2(pEquilibrio))} para empatar.`
            : `Você perde ${formatBRL(-lucroLiquidoUnit)} por unidade no ${rotulo}, e nenhum preço cobre os custos com estas premissas.`;
    }
    else if (status === "atencao") {
        mensagem = Number.isFinite(pMeta)
            ? `Lucro de ${formatBRL(lucroLiquidoUnit)} por unidade (${formatPct(margemLiquidaPct, 1)}), abaixo da meta de ${formatPct(prem.margemAlvoPct, 1)}. Para a meta, o preço final seria ${formatBRL(ceil2(pMeta))}.`
            : `Lucro de ${formatBRL(lucroLiquidoUnit)} por unidade (${formatPct(margemLiquidaPct, 1)}), abaixo da meta de ${formatPct(prem.margemAlvoPct, 1)}.`;
    }
    else {
        const folga = descontoAte(precoTabela, pMeta).valor;
        const resto = r2(folga - descontoValorUnit);
        mensagem =
            resto > 0
                ? `Margem de ${formatPct(margemLiquidaPct, 1)}, dentro da meta. Ainda dá para dar mais ${formatBRL(resto)} de desconto por unidade no ${rotulo} sem sair da meta.`
                : `Margem de ${formatPct(margemLiquidaPct, 1)}, dentro da meta. Este é o limite de desconto para manter a meta no ${rotulo}.`;
    }
    const tot = (v) => r2(v * quantidade);
    return {
        precoTabela,
        descontoPct,
        descontoValorUnit,
        precoFinalUnit,
        quantidade,
        taxaOperadoraPct: taxaPct,
        taxaEncontrada: encontrada,
        custoTotalUnit,
        impostosSaidaUnit,
        lucroBrutoUnit,
        rateioFixoUnit,
        lucroOperacionalUnit,
        taxaOperadoraUnit,
        lucroLiquidoUnit,
        margemBrutaPct,
        margemOperacionalPct,
        margemLiquidaPct,
        totais: {
            receitaBruta: tot(precoFinalUnit),
            custoMercadoria: tot(custoTotalUnit),
            impostosSaida: tot(impostosSaidaUnit),
            lucroBruto: tot(lucroBrutoUnit),
            rateioFixo: tot(rateioFixoUnit),
            lucroOperacional: tot(lucroOperacionalUnit),
            taxaOperadora: tot(taxaOperadoraUnit),
            lucroLiquido: tot(lucroLiquidoUnit),
            descontoConcedido: tot(descontoValorUnit),
        },
        markupPraticadoPct: custoTotalUnit > 0 ? ((precoFinalUnit - custoTotalUnit) / custoTotalUnit) * 100 : 0,
        markup,
        status,
        posicaoTermometro: termo.posicao,
        mensagem,
        avisos,
    };
}
// ───────────────────────── comparativos e curva ─────────────────────────
function todasAsCondicoes() {
    const lista = [
        { forma: "pix", parcelas: 1 },
        { forma: "debito", parcelas: 1 },
    ];
    for (let n = 1; n <= 12; n++)
        lista.push({ forma: "credito", parcelas: n });
    return lista;
}
/** Resultado do mesmo desconto em cada forma de pagamento + desconto máximo de cada uma. */
function tabelaComparativa(input) {
    const custoTotal = custoTotalUnitario(input.custo);
    return todasAsCondicoes().map((condicao) => {
        const r = simular({ ...input, pagamento: condicao });
        return {
            condicao,
            rotulo: condicao.forma === "pix" ? "PIX / Dinheiro" : rotuloCondicao(condicao),
            taxaPct: r.taxaOperadoraPct,
            lucroLiquidoUnit: r.lucroLiquidoUnit,
            margemLiquidaPct: r.margemLiquidaPct,
            status: r.status,
            descontoMax: descontoMaximo(Math.max(0, finito(input.precoTabela)), custoTotal, input.premissas, r.taxaOperadoraPct),
        };

/** Lucro líquido unitário × desconto, à vista e na condição escolhida (para o gráfico). */
function curvaDesconto(input, pontos = 40) {
    const custoTotal = custoTotalUnitario(input.custo);
    const P = Math.max(0, finito(input.precoTabela));
    const taxaSel = taxaDaCondicao(input.pagamento, input.taxas).taxaPct;
    const dmAvista = descontoMaximo(P, custoTotal, input.premissas, 0).semPrejuizoPct;
    const dmSel = descontoMaximo(P, custoTotal, input.premissas, taxaSel).semPrejuizoPct;
    const maxPct = clamp(Math.ceil(Math.max(dmAvista, dmSel) * 1.3 + 2), 10, 100);
    const avista = { forma: "pix", parcelas: 1 };
    const lista = [];
    for (let i = 0; i <= pontos; i++) {
        const d = (maxPct * i) / pontos;
        const base = { ...input, desconto: { tipo: "percentual", valor: d } };
        lista.push({
            descontoPct: Math.round(d * 100) / 100,
            lucroAvista: r2(simular({ ...base, pagamento: avista }).lucroLiquidoUnit),
            lucroSelecionado: r2(simular({ ...base, pagamento: input.pagamento }).lucroLiquidoUnit),
        });
    }
    return { pontos: lista, maxPct };
}

return { formatBRL, formatPct, formatCampo, parseDecimalBR, clamp, r2, floor2, ceil2, custoTotalUnitario,
    normalizarCondicao, rotuloCondicao, taxaDaCondicao, calcularMarkup, precoMinimo, descontoMaximo,

/* ── datas (sempre no fuso local do aparelho) ── */
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const hoje = () => ymd(new Date());
const addDias = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMeses = (s, n) => {
  const d = parseYmd(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return ymd(d);
};
const iniMes = (s) => s.slice(0, 8) + "01";
const fimMes = (s) => { const d = parseYmd(s); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const fmtData = (s) => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "");
const nowIso = () => { const d = new Date(); return `${ymd(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const rotMes = (s) => parseYmd(s).toLocaleDateString("pt-BR", { month: "short" }).replace(".", "");
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();

/* ═══════════════ dados ═══════════════ */

function lerStorage(k) { try { return localStorage.getItem(k); } catch (e) { storageOk = false; return null; } }
function gravarStorage(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { storageOk = false; return false; } }

const temaEfetivo = () => (tema === "auto" ? (escuroDoSistema() ? "escuro" : "claro") : tema);

function migrar(d) {

  for (const k of ["taxas", "produtos", "movs", "notas", "lanc", "vendas", "entregas"]) if (!Array.isArray(o[k])) o[k] = base[k];

}

/* ═══════════════ produtos, estoque, custo médio ═══════════════ */
const prod = (id) => db.produtos.find((p) => p.id === id);
const premissasDe = (p) => ({
  aliquotaImpostoSaidaPct: db.empresa.aliq,
  custosFixosPct: db.empresa.fixos,
  margemAlvoPct: p && p.margem != null ? p.margem : db.empresa.meta,
});
const custoTotal = (p) => p.custo.compra + p.custo.frete + p.custo.imp;
const toEngineCusto = (c) => ({ custoCompra: c.compra, custoFrete: c.frete, impostosEntrada: c.imp });
const taxasEngine = () => db.taxas.map((t) => ({ forma: t.forma, parcelas: t.parcelas, taxaPct: t.taxaPct }));

function novoProduto(o) {
  return Object.assign({
    id: uid(), sku: "", nome: "", un: "un", ncm: "", codForn: "", cnpjForn: "",
    custo: { compra: 0, frete: 0, imp: 0 }, preco: 0, margem: null, estoque: 0, minimo: 0, ativo: true,
  }, o);
}
function skuLivre(base) {
  let sku = base || `P${db.produtos.length + 1}`, n = 2;
  while (db.produtos.some((p) => norm(p.sku) === norm(sku))) sku = `${base || "P"}-${n++}`;
  return sku;
}
/** Movimenta o estoque. Entrada recalcula o custo médio ponderado de compra, frete e imposto. */
function movimentar({ produtoId, tipo, qtd, sentido = 1, custo, origem = "manual", origemId = null, obs = "", data }) {
  const p = prod(produtoId);
  if (!p || !(qtd > 0)) return null;
  if (tipo === "entrada") {
    const base = Math.max(p.estoque, 0), tot = base + qtd;
    if (custo && tot > 0) {
      for (const k of ["compra", "frete", "imp"]) {
        p.custo[k] = Math.round(((p.custo[k] * base + (custo[k] ?? p.custo[k]) * qtd) / tot) * 10000) / 10000;
      }
    }
    p.estoque += qtd;
  } else if (tipo === "saida") p.estoque -= qtd;
  else p.estoque += qtd * sentido;
  p.estoque = Math.round(p.estoque * 1000) / 1000;
  const m = { id: uid(), produtoId, tipo, qtd, sentido, origem, origemId, obs, data: data || nowIso(), saldo: p.estoque };
  db.movs.push(m);
  return m;
}
function saidas30(produtoId, ref = hoje()) {
  const de = addDias(ref, -29);
  let q = 0;
  for (const v of db.vendas) {
    if (v.status === "cancelada") continue;
    const d = v.data.slice(0, 10);
    if (d < de || d > ref) continue;
    for (const it of v.itens) if (it.produtoId === produtoId) q += it.qtd;
  }
  return q;
}
function cobertura(p) {
  const s = saidas30(p.id);
  return s > 0 ? p.estoque / (s / 30) : null;
}
const statusEstoque = (p) => (p.estoque <= 0 ? "zerado" : p.estoque <= p.minimo ? "baixo" : "ok");

/* ═══════════════ vendas ═══════════════ */
function registrarVenda(o) {
  const prem = o.premissas;
  const r = E.simular({
    custo: toEngineCusto(o.custo), premissas: prem, taxas: taxasEngine(),
    precoTabela: o.precoTabela, quantidade: o.qtd, desconto: o.desconto, pagamento: o.pagamento,
  });
  const id = uid();
  const numero = ++db.seqVenda;
  const data = o.data || nowIso();
  const dia = data.slice(0, 10);
  const pg = E.normalizarCondicao(o.pagamento);
  const rot = E.rotuloCondicao(pg);
  const v = {
    id, numero, data, cliente: (o.cliente || "").trim(), forma: pg.forma, parcelas: pg.parcelas,
    itens: [{ produtoId: o.produtoId || null, nome: o.nome, qtd: o.qtd, precoTabela: r.precoTabela, descontoUnit: r.descontoValorUnit, precoUnit: r.precoFinalUnit, custoUnit: r.custoTotalUnit }],
    subtotal: r2(r.precoTabela * o.qtd), desconto: r.totais.descontoConcedido, total: r.totais.receitaBruta,
    taxaPct: r.taxaOperadoraPct, taxaValor: r.totais.taxaOperadora, impostos: r.totais.impostosSaida,
    custo: r.totais.custoMercadoria, fixoRateio: r.totais.rateioFixo, lucro: r.totais.lucroLiquido,
    margemPct: r.margemLiquidaPct, status: "paga",
  };
  db.vendas.push(v);

  // Recebimento (líquido da taxa): PIX/dinheiro/débito entram na hora; crédito cai uma parcela por mês.
  const liquido = r2(v.total - v.taxaValor);
  if (liquido > 0) {
    const n = pg.forma === "credito" ? pg.parcelas : 1;
    let restante = liquido;
    for (let i = 1; i <= n; i++) {
      const valor = i === n ? r2(restante) : r2(liquido / n);
      restante = r2(restante - valor);
      if (valor <= 0) continue;
      const venc = pg.forma === "credito" ? addMeses(dia, i) : dia;
      const pago = venc <= hoje();
      db.lanc.push({
        id: uid(), tipo: "receita", categoria: "venda", valor, data: venc, pagoEm: pago ? venc : null,
        status: pago ? "pago" : "pendente", forma: pg.forma, vendaId: id, auto: true,
        descricao: `Venda #${numero}${v.cliente ? " · " + v.cliente : ""} · ${rot}${n > 1 ? ` (${i}/${n})` : ""}`,
      });
    }
  }
  if (o.produtoId && prod(o.produtoId)) {
    movimentar({ produtoId: o.produtoId, tipo: "saida", qtd: o.qtd, origem: "venda", origemId: id, data });
  }
  if (o.entrega) {
    db.entregas.push({ id: uid(), vendaId: id, numeroVenda: numero, cliente: v.cliente, endereco: (o.endereco || "").trim(), status: "separacao", criadoEm: data, atualizadoEm: data });
  }
  return v;
}
function cancelarVenda(id) {
  const v = db.vendas.find((x) => x.id === id);
  if (!v || v.status === "cancelada") return;
  v.status = "cancelada";
  db.lanc = db.lanc.filter((l) => l.vendaId !== id);
  db.entregas = db.entregas.filter((e) => e.vendaId !== id);
  for (const it of v.itens) {
    if (it.produtoId && prod(it.produtoId)) movimentar({ produtoId: it.produtoId, tipo: "ajuste", sentido: 1, qtd: it.qtd, origem: "cancelamento", origemId: id, obs: `Venda #${v.numero} cancelada` });
  }
}
/** Recebimentos já vencidos (cartão, etc.) viram "pago" sozinhos. */
function liquidarRecebimentos() {
  let mudou = false;
  const h0 = hoje();
  for (const l of db.lanc) {
    if (l.auto && l.tipo === "receita" && l.status === "pendente" && l.data <= h0) { l.status = "pago"; l.pagoEm = l.data; mudou = true; }
  }
  return mudou;
}

/* ═══════════════ notas fiscais de compra ═══════════════ */
function acharProduto(it, cnpj) {
  const cod = norm(it.codigo);
  if (cod) {
    const p = db.produtos.find((x) => x.codForn && norm(x.codForn) === cod && (!x.cnpjForn || !cnpj || x.cnpjForn === cnpj));
    if (p) return p;
  }
  const n = norm(it.descricao);
  return db.produtos.find((x) => norm(x.nome) === n) || null;
}
/** Confirma a compra: lança no Contas a Pagar e dá entrada no estoque atualizando o custo médio. */
function confirmarNota(n) {
  const notaId = uid();
  const somaItens = n.itens.reduce((s, i) => s + i.valorTotal, 0) || 1;
  const frete = Math.max(0, n.frete || 0);
  const resumoItens = [];
  for (const it of n.itens) {
    const qtd = it.qtd;
    const custoUnit = {
      compra: it.valorTotal / qtd,
      frete: (frete * (it.valorTotal / somaItens)) / qtd,
      imp: Math.max(0, it.impostos || 0) / qtd,
    };
    let p = it.produtoId && it.produtoId !== "novo" ? prod(it.produtoId) : null;
    if (!p) {
      p = novoProduto({
        sku: skuLivre(it.codigo || ""), nome: it.descricao, un: it.un || "un", ncm: it.ncm || "",
        codForn: it.codigo || "", cnpjForn: n.cnpj || "", custo: { compra: 0, frete: 0, imp: 0 },
      });
      db.produtos.push(p);
      const ct = custoUnit.compra + custoUnit.frete + custoUnit.imp;
      p.preco = E.calcularMarkup(ct, premissasDe(p), 0).precoSugerido;
    } else if (it.codigo && !p.codForn) { p.codForn = it.codigo; p.cnpjForn = n.cnpj || ""; }
    movimentar({ produtoId: p.id, tipo: "entrada", qtd, custo: custoUnit, origem: "nota_fiscal", origemId: notaId, obs: `NF ${n.numero || ""} · ${n.fornecedor || ""}`.trim(), data: (n.data || hoje()) + "T12:00:00" });
    resumoItens.push({ produtoId: p.id, descricao: it.descricao, qtd, valorTotal: it.valorTotal });
  }
  const nota = {
    id: notaId, fornecedor: n.fornecedor, cnpj: n.cnpj, numero: n.numero, chave: n.chave, data: n.data || hoje(),
    origem: n.origem, frete, total: n.total, itens: resumoItens, criadaEm: nowIso(),
  };
  db.notas.push(nota);
  const vencs = n.vencimentos && n.vencimentos.length ? n.vencimentos : [{ data: n.vencimento || addDias(hoje(), 30), valor: n.total }];
  vencs.forEach((vc, i) => {
    const pago = !!n.pagoNaHora;
    db.lanc.push({
      id: uid(), tipo: "despesa", categoria: "fornecedor", valor: r2(vc.valor), data: vc.data, pagoEm: pago ? hoje() : null,
      status: pago ? "pago" : "pendente", forma: n.forma || "boleto", notaId,
      descricao: `NF ${n.numero || "s/n"} · ${n.fornecedor || "Fornecedor"}${vencs.length > 1 ? ` (${i + 1}/${vencs.length})` : ""}`,
    });
  });
  return nota;
}

/** Lê o XML de uma NF-e/NFC-e no próprio aparelho (sem IA, sem internet). */
function parseNFeXML(txt) {
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Arquivo XML inválido.");
  const all = (el, tag) => Array.from(el.getElementsByTagNameNS("*", tag));
  const g = (el, tag) => { const n = el && el.getElementsByTagNameNS("*", tag)[0]; return n ? n.textContent.trim() : ""; };
  const num = (el, tag) => { const x = parseFloat(g(el, tag)); return Number.isFinite(x) ? x : 0; };
  const inf = all(doc, "infNFe")[0];
  if (!inf) throw new Error("Não encontrei uma NF-e neste XML.");
  const emit = all(inf, "emit")[0], ide = all(inf, "ide")[0], tot = all(inf, "ICMSTot")[0];
  const itens = all(inf, "det").map((det) => {
    const p = all(det, "prod")[0], imp = all(det, "imposto")[0];
    const qtd = num(p, "qCom") || 1;
    const valorTotal = r2(num(p, "vProd") - num(p, "vDesc") + num(p, "vSeg") + num(p, "vOutro"));
    return {
      codigo: g(p, "cProd"), descricao: g(p, "xProd"), ncm: g(p, "NCM"), un: (g(p, "uCom") || "un").toLowerCase(),
      qtd, valorUnit: valorTotal / qtd, valorTotal, impostos: r2(num(imp, "vIPI") + num(imp, "vICMSST")),
      freteItem: num(p, "vFrete"),
    };
  });
  if (!itens.length) throw new Error("A nota não tem itens.");
  const freteNota = tot ? num(tot, "vFrete") : itens.reduce((s, i) => s + i.freteItem, 0);
  const vencimentos = all(inf, "dup").map((d) => ({ data: g(d, "dVenc"), valor: num(d, "vDup") })).filter((d) => d.data && d.valor > 0);
  const total = tot ? num(tot, "vNF") : r2(itens.reduce((s, i) => s + i.valorTotal + i.impostos, 0) + freteNota);
  return {
    origem: "xml", fornecedor: g(emit, "xNome"), cnpj: g(emit, "CNPJ"), numero: g(ide, "nNF"), serie: g(ide, "serie"),
    chave: (inf.getAttribute("Id") || "").replace(/\D/g, ""), data: (g(ide, "dhEmi") || g(ide, "dEmi")).slice(0, 10),
    frete: freteNota, total, itens, vencimentos,
  };
}
/** Normaliza o JSON devolvido pela IA ao ler foto/PDF de nota. */
function normalizarNotaIA(j) {
  const n = (x) => { const v = typeof x === "string" ? E.parseDecimalBR(x) : Number(x); return Number.isFinite(v) ? v : 0; };
  const itens = (Array.isArray(j.itens) ? j.itens : []).map((i) => {
    const qtd = n(i.qtd) > 0 ? n(i.qtd) : 1;
    const valorTotal = n(i.valorTotal) || r2(n(i.valorUnit) * qtd);
    return { codigo: String(i.codigo || ""), descricao: String(i.descricao || "Item"), ncm: String(i.ncm || "").replace(/\D/g, ""), un: String(i.un || "un").toLowerCase(), qtd, valorUnit: valorTotal / qtd, valorTotal: r2(valorTotal), impostos: r2(n(i.impostos)) };
  }).filter((i) => i.valorTotal > 0 || i.descricao);
  if (!itens.length) throw new Error("A IA não encontrou itens na nota.");
  const frete = n(j.frete);
  const total = n(j.valorTotal) || r2(itens.reduce((s, i) => s + i.valorTotal + i.impostos, 0) + frete);
  const dt = /^\d{4}-\d{2}-\d{2}$/.test(j.dataEmissao || "") ? j.dataEmissao : "";
  const vencimentos = (Array.isArray(j.vencimentos) ? j.vencimentos : []).map((v) => ({ data: /^\d{4}-\d{2}-\d{2}$/.test(v.data || "") ? v.data : "", valor: n(v.valor) })).filter((v) => v.data && v.valor > 0);
  return { origem: "ia", fornecedor: String(j.fornecedor || ""), cnpj: String(j.cnpj || "").replace(/\D/g, ""), numero: String(j.numero || ""), chave: String(j.chave || "").replace(/\D/g, ""), data: dt, frete, total, itens, vencimentos };
}

/* ═══════════════ agregações: DRE simplificado ═══════════════ */
const noPeriodo = (dia, p) => dia >= p.de && dia <= p.ate;
function periodoPor(chave, ref = hoje()) {
  if (chave === "mes") return { chave, de: iniMes(ref), ate: fimMes(ref), rot: "este mês" };
  if (chave === "30d") return { chave, de: addDias(ref, -29), ate: ref, rot: "últimos 30 dias" };
  if (chave === "90d") return { chave, de: addDias(ref, -89), ate: ref, rot: "últimos 90 dias" };
  return { chave: "tudo", de: "0000-01-01", ate: "9999-12-31", rot: "todo o período" };
}
/** Janela anterior comparável (mesmo número de dias já decorridos). */
function periodoAnterior(p, ref = hoje()) {
  if (p.chave === "mes") {
    const pm = addMeses(iniMes(ref), -1);
    const dia = Math.min(parseYmd(ref).getDate(), parseYmd(fimMes(pm)).getDate());
    return { de: pm, ate: pm.slice(0, 8) + pad2(dia) };
  }
  if (p.chave === "tudo") return null;
  const n = p.chave === "30d" ? 30 : 90;
  return { de: addDias(p.de, -n), ate: addDias(p.de, -1) };
}
/**
 * Regras (competência):
 *  Faturamento = vendas · CMV = custo do que foi vendido · Lucro bruto = faturamento − CMV
 *  Lucro operacional = lucro bruto − despesas fixas, variáveis e outras
 *  Lucratividade real = lucro operacional − impostos sobre vendas − taxas da maquininha + outras receitas

function resumo(p) {
  const vs = db.vendas.filter((v) => v.status !== "cancelada" && noPeriodo(v.data.slice(0, 10), p));
  const ls = db.lanc.filter((l) => l.status !== "cancelado" && noPeriodo(l.data, p));
  const sum = (arr, f) => r2(arr.reduce((s, x) => s + f(x), 0));
  const desp = (cat) => sum(ls.filter((l) => l.tipo === "despesa" && l.categoria === cat), (l) => l.valor);

  const fixas = desp("fixa"), variaveis = desp("variavel"), outros = desp("outros");
  const outrasReceitas = sum(ls.filter((l) => l.tipo === "receita" && l.categoria !== "venda"), (l) => l.valor);

    margemBrutaPct: faturamento > 0 ? (lucroBruto / faturamento) * 100 : 0,
    fixoRealPct: faturamento > 0 ? (fixas / faturamento) * 100 : 0,

function serieMensal(n = 6, ref = hoje()) {

    const r = resumo({ de: ini, ate: fimMes(ini) });
    out.push({ mes: ini, rot: rotMes(ini), receita: r.faturamento, despesa: r.despesasTotais, margem: r.margemRealPct, lucro: r.lucroReal, temDados: r.nVendas > 0 || r.despesasTotais > 0 });

/** Curva ABC por lucro líquido real no período. */
function curvaABC(p) {
  const m = new Map();
  for (const v of db.vendas) {
    if (v.status === "cancelada" || !noPeriodo(v.data.slice(0, 10), p)) continue;
    for (const it of v.itens) {
      const k = it.produtoId || it.nome;
      const o = m.get(k) || { nome: it.nome, produtoId: it.produtoId, lucro: 0, receita: 0, qtd: 0 };
      const peso = v.itens.length === 1 ? 1 : (it.precoUnit * it.qtd) / (v.total || 1);
      o.lucro += v.lucro * peso; o.receita += it.precoUnit * it.qtd; o.qtd += it.qtd; m.set(k, o);
    }
  }
  const lista = [...m.values()].filter((x) => x.lucro > 0).sort((a, b) => b.lucro - a.lucro);
  const tot = lista.reduce((s, x) => s + x.lucro, 0) || 1;
  let ac = 0;
  return lista.map((x) => { ac += x.lucro; const pct = (ac / tot) * 100; return { ...x, share: (x.lucro / tot) * 100, acumulado: pct, classe: pct - (x.lucro / tot) * 100 < 80 ? "A" : pct - (x.lucro / tot) * 100 < 95 ? "B" : "C" }; });
}

/* ═══════════════ copiloto (regras locais) ═══════════════ */
function gerarInsights() {
  const ref = hoje();

  const R = resumo(mes), A = ant ? resumo(ant) : null;

  if (R.faturamento > 0 && A && A.faturamento > 0 && A.taxas > 0) {
    const varRel = ((R.taxasPct - A.taxasPct) / A.taxasPct) * 100;
    if (varRel >= 4) add(varRel >= 15 ? "critico" : "atencao", `Seu custo com taxas de cartão subiu ${nf(varRel, 0)}% este mês`,
      `As taxas consumiram ${pc(R.taxasPct, 2)} do faturamento (no mesmo período do mês passado: ${pc(A.taxasPct, 2)}). Venda parcelada em muitas vezes pesa: compare as condições no simulador.`, { rot: "Comparar parcelas", tab: "precos" });
  }

  const criticosTop = [];
  abc.slice(0, 3).forEach((x) => {
    const p = x.produtoId && prod(x.produtoId);
    if (p && p.estoque <= p.minimo) { criticosTop.push(p); add("critico", `${p.nome} dá ${nf((x.lucro / totalLucro) * 100, 0)}% do seu lucro e está com estoque crítico`, `Restam ${nf(p.estoque)} ${p.un} (mínimo ${nf(p.minimo)}). Reponha antes de perder vendas.`, { rot: "Ver estoque", tab: "estoque" }); }
  });

  if (curtos.length) add("atencao", "Estoque para menos de 10 dias", curtos.slice(0, 3).map((p) => `${p.nome} (${nf(cobertura(p), 0)} dias)`).join(", ") + ". Pelo ritmo dos últimos 30 dias.", { rot: "Ver estoque", tab: "estoque" });
  // 4) preço de tabela abaixo da meta

    const r = E.simular({ custo: toEngineCusto(p.custo), premissas: premissasDe(p), taxas: taxasEngine(), precoTabela: p.preco, quantidade: 1, desconto: { tipo: "percentual", valor: 0 }, pagamento: { forma: "pix", parcelas: 1 } });
    if (r.status !== "saudavel") fracos.push({ p, sug: r.markup.precoSugerido, m: r.margemLiquidaPct });
  }
  if (fracos.length) add(fracos.some((f) => f.m < 0) ? "critico" : "atencao", `${fracos.length} produto${fracos.length > 1 ? "s" : ""} com preço de tabela abaixo da meta de margem`,
    fracos.slice(0, 3).map((f) => `${f.p.nome}: preço de ${brl(f.p.preco)} dá ${pc(f.m, 1)}; para a meta, ${brl(f.sug)}`).join(" · "), { rot: "Reprecificar", tab: "precos" });
  // 5) vendas com prejuízo
  const perda = R.vendas.filter((v) => v.lucro < 0);
  if (perda.length) add("critico", `${perda.length} venda${perda.length > 1 ? "s" : ""} com prejuízo este mês`, `Somam ${brl(-perda.reduce((s, v) => s + v.lucro, 0))} de perda. Quase sempre é desconto demais combinado com cartão parcelado.`, { rot: "Ver vendas", tab: "caixa", vendas: true });

  if (R.faturamento > 0) {

  }

  // 8) custo fixo real × rateio usado nos preços
  const mesAnt = periodoPor("mes", addMeses(iniMes(ref), -1));
  const Rm = resumo(mesAnt);

  }
  // 9) saúde geral
  if (R.faturamento > 0) {
    add(R.margemRealPct >= db.empresa.meta ? "ok" : R.margemRealPct >= 0 ? "atencao" : "critico", `Margem líquida real do mês: ${pc(R.margemRealPct, 1)}`,

  }

  const peso = { critico: 0, atencao: 1, info: 2, ok: 3 };
  return out.sort((a, b) => peso[a.nivel] - peso[b.nivel]).slice(0, 8);
}

/* ═══════════════ MIDAS · gráficos em SVG (sem bibliotecas) ═══════════════
   Regras: séries azul/laranja validadas contra o fundo de cada tema (claro #fbfaf7, escuro #131d33) · legenda sempre que há 2+ séries ·
   eixo único · grade discreta · dica ao passar o mouse/tocar (data-tip) · visão em tabela. */
/* As cores vêm das variáveis CSS do tema ativo (lidas na hora de desenhar), assim o gráfico acompanha Claro/Escuro. */
const lerVar = (nome, padrao) => {
  try { const v = getComputedStyle(document.documentElement).getPropertyValue(nome).trim(); return v || padrao; } catch (e) { return padrao; }
};
const COR = {
  get s1() { return lerVar("--s1", "#2f6fc8"); }, get s2() { return lerVar("--s2", "#c4531f"); },
  get grade() { return lerVar("--line", "#e2ded3"); }, get eixo() { return lerVar("--dim", "#5e6980"); },
  get ouro() { return lerVar("--gold", "#f59e0b"); }, get ouroTxt() { return lerVar("--gold-ink", "#9a4a06"); },
  get fundo() { return lerVar("--panel-2", "#fbfaf7"); },
  get tBad() { return lerVar("--t-bad", "#e11d48"); }, get tWarn() { return lerVar("--t-warn", "#ca8a04"); }, get tOk() { return lerVar("--t-ok", "#059669"); },
};

const larguraChart = () => (window.innerWidth < 700 ? Math.max(280, Math.min(window.innerWidth - 66, 640)) : 640);
function fmtCompacto(n) {
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e6) return `${s}R$ ${nf(a / 1e6, 1)} mi`;
  if (a >= 1e3) return `${s}R$ ${nf(a / 1e3, a >= 1e4 ? 0 : 1)} mil`;
  return `${s}R$ ${nf(a, 0)}`;
}
function ticksBonitos(min, max, alvo = 4) {
  if (!(max > min)) max = min + 1;
  const bruto = (max - min) / alvo, mag = Math.pow(10, Math.floor(Math.log10(bruto))), r = bruto / mag;
  const passo = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const ini = Math.floor(min / passo + 1e-9) * passo, fim = Math.ceil(max / passo - 1e-9) * passo, ts = [];
  for (let v = ini; v <= fim + passo / 1e6; v += passo) ts.push(+v.toFixed(6));
  return ts;
}
const legenda = (itens) => h`<ul class="legend" aria-label="Legenda">${itens.map((i) => h`<li><i class="${i.sq ? "sq" : ""}" style="background:${i.cor}"></i>${i.nome}</li>`)}</ul>`;

/** Visão em tabela dos mesmos dados (acessibilidade e conferência). */
function tabelaView(cab, linhas, titulo = "Ver em tabela") {
  return h`<details class="acc" style="margin-top:8px"><summary class="small muted"><span>${titulo}</span>${ico("chev")}</summary>
    <div class="tablewrap"><table class="tab small"><thead><tr>${cab.map((c, i) => h`<th class="${i ? "r" : ""}">${c}</th>`)}</tr></thead>
    <tbody>${linhas.map((l) => h`<tr>${l.map((c, i) => h`<td class="${i ? "r" : ""}">${c}</td>`)}</tr>`)}</tbody></table></div></details>`;
}

function caminhoBarra(x, w, yBase, yFim) {
  const alt = Math.abs(yFim - yBase);
  if (alt < 0.5) return "";
  const r = Math.min(4, alt / 2, w / 2);
  if (yFim < yBase) return `M${x},${yBase}V${yFim + r}Q${x},${yFim} ${x + r},${yFim}H${x + w - r}Q${x + w},${yFim} ${x + w},${yFim + r}V${yBase}Z`;
  return `M${x},${yBase}V${yFim - r}Q${x},${yFim} ${x + r},${yFim}H${x + w - r}Q${x + w},${yFim} ${x + w},${yFim - r}V${yBase}Z`;
}

/** Barras agrupadas por categoria (ex.: receitas × despesas por mês). */
function chartBarras({ rotulos, series, altura = 230, fmtTip = brl, descricao = "" }) {
  const W = larguraChart(), H = altura, m = { t: 10, r: 8, b: 26, l: 58 };
  const todos = series.flatMap((s) => s.valores);
  const tk = ticksBonitos(Math.min(0, ...todos), Math.max(1, ...todos)), y0 = tk[0], y1 = tk[tk.length - 1];
  const iw = W - m.l - m.r, ih = H - m.t - m.b, y = (v) => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const gw = iw / rotulos.length, n = series.length, gap = 2;
  const bw = Math.max(6, Math.min(30, (gw * 0.72 - gap * (n - 1)) / n));
  const grupoW = bw * n + gap * (n - 1);
  const base = y(0);
  const grade = tk.map((v) => h`<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${COR.grade}"></line><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmtCompacto(v)}</text>`);
  const barras = rotulos.map((rot, i) => {
    const cx = m.l + gw * i + gw / 2, x0 = cx - grupoW / 2;
    const tip = [rot, ...series.map((s) => `${s.cor}|${s.nome}: ${fmtTip(s.valores[i])}`)].join("\n");
    return h`<g>${series.map((s, k) => h`<path d="${caminhoBarra(x0 + k * (bw + gap), bw, base, y(s.valores[i]))}" fill="${s.cor}"></path>`)}
      <text x="${cx}" y="${H - 8}" text-anchor="middle">${rot}</text>
      <rect x="${m.l + gw * i}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent" data-tip="${tip}"></rect></g>`;
  });
  return h`${series.length > 1 ? legenda(series.map((s) => ({ nome: s.nome, cor: s.cor, sq: true }))) : ""}
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${descricao}"><g class="gl">${grade}</g>
    <line x1="${m.l}" x2="${W - m.r}" y1="${base}" y2="${base}" stroke="${COR.eixo}" stroke-width="1"></line>${barras}</svg>
    ${tabelaView(["Período", ...series.map((s) => s.nome)], rotulos.map((r, i) => [r, ...series.map((s) => fmtTip(s.valores[i]))]))}`;
}

/**
 * Linhas. `xs` (números, escala linear) ou `rotulos` (categorias). `refs`: linhas de referência horizontais.
 * `marcaX`: linha vertical dourada ("seu desconto").
 */
function chartLinhas({ xs, rotulos, series, altura = 230, fmtY = fmtCompacto, fmtX = (v) => nf(v, 0), fmtTip = brl, tituloTip = (i) => (rotulos ? rotulos[i] : fmtX(xs[i])), pontos = false, refs = [], marcaX = null, rotMarca = "", descricao = "", sufixoY = "" }) {
  const W = larguraChart(), H = altura, m = { t: 14, r: 12, b: 26, l: sufixoY ? 52 : 62 };
  const n = series[0].valores.length, todos = series.flatMap((s) => s.valores).concat(refs.map((r) => r.y));
  const tk = ticksBonitos(Math.min(0, ...todos), Math.max(0.0001, ...todos)), y0 = tk[0], y1 = tk[tk.length - 1];
  const iw = W - m.l - m.r, ih = H - m.t - m.b, y = (v) => m.t + ih - ((v - y0) / (y1 - y0)) * ih;
  const xmin = xs ? xs[0] : 0, xmax = xs ? xs[n - 1] : 1;
  const px = (i) => (xs ? m.l + ((xs[i] - xmin) / ((xmax - xmin) || 1)) * iw : m.l + (iw * (i + 0.5)) / n);
  const fy = (v) => (sufixoY ? `${nf(v, 0)}${sufixoY}` : fmtY(v));
  const grade = tk.map((v) => h`<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${COR.grade}"></line><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fy(v)}</text>`);
  let eixoX;
  if (xs) {
    const tx = ticksBonitos(xmin, xmax, 5).filter((v) => v >= xmin - 1e-9 && v <= xmax + 1e-9);
    eixoX = tx.map((v) => h`<text x="${m.l + ((v - xmin) / ((xmax - xmin) || 1)) * iw}" y="${H - 8}" text-anchor="middle">${fmtX(v)}</text>`);
  } else eixoX = rotulos.map((r, i) => h`<text x="${px(i)}" y="${H - 8}" text-anchor="middle">${r}</text>`);
  const linhas = series.map((s) => {
    const d = s.valores.map((v, i) => `${i ? "L" : "M"}${px(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    return h`<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
      ${pontos ? s.valores.map((v, i) => h`<circle cx="${px(i)}" cy="${y(v)}" r="4" fill="${s.cor}" stroke="${COR.fundo}" stroke-width="2"></circle>`) : ""}`;
  });
  const refsSvg = refs.map((r) => h`<line x1="${m.l}" x2="${W - m.r}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${r.cor || COR.eixo}" stroke-dasharray="4 4"></line>
    <text x="${W - m.r - 2}" y="${y(r.y) - 5}" text-anchor="end" style="${r.cor ? `fill:${r.cor}` : ""}">${r.rot}</text>`);
  let marca = "";
  if (marcaX != null && xs) {
    const mx = m.l + ((Math.min(marcaX, xmax) - xmin) / ((xmax - xmin) || 1)) * iw, esq = mx < m.l + iw / 2;
    marca = h`<line x1="${mx}" x2="${mx}" y1="${m.t}" y2="${m.t + ih}" stroke="${COR.ouro}" stroke-width="2"></line>
      <text x="${esq ? mx + 6 : mx - 6}" y="${m.t + 12}" text-anchor="${esq ? "start" : "end"}" style="fill:${COR.ouroTxt}">${rotMarca}</text>`;
  }
  const colW = iw / Math.max(1, xs ? n - 1 : n);
  const hits = Array.from({ length: n }, (_, i) => {
    const tip = [tituloTip(i), ...series.map((s) => `${s.cor}|${s.nome}: ${fmtTip(s.valores[i])}`)].join("\n");
    const x = xs ? px(i) - colW / 2 : m.l + (iw * i) / n, w = xs ? colW : iw / n;
    return h`<rect x="${Math.max(m.l, x)}" y="${m.t}" width="${w}" height="${ih}" fill="transparent" data-tip="${tip}"></rect>`;
  });
  const zeroY = y(0);
  const zero = y0 < 0 && !refs.some((r) => r.y === 0) ? h`<line x1="${m.l}" x2="${W - m.r}" y1="${zeroY}" y2="${zeroY}" stroke="${COR.eixo}" stroke-dasharray="4 4"></line>` : "";
  const xLabels = xs ? xs.filter((_, i) => i % Math.max(1, Math.floor(n / 8)) === 0 || i === n - 1) : rotulos;
  const tab = tabelaView([xs ? "Desconto" : "Período", ...series.map((s) => s.nome)],
    (xs ? xs.map((_, i) => i).filter((i) => i % Math.max(1, Math.floor(n / 8)) === 0 || i === n - 1) : rotulos.map((_, i) => i))
      .map((i) => [tituloTip(i), ...series.map((s) => fmtTip(s.valores[i]))]));
  void xLabels;
  return h`${series.length > 1 ? legenda(series.map((s) => ({ nome: s.nome, cor: s.cor }))) : ""}
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${descricao}"><g class="gl">${grade}</g>${zero}${refsSvg}${marca}${linhas}<g>${eixoX}</g>${hits}</svg>${tab}`;
}

/* ── componentes de formulário ── */
function campo({ label, bind, valor, re = "none", pre = "", suf = "", tipo = "text", ph = "", cls = "", grande = false, dica = "", dec = true, id, numerico = false, extra = "" }) {

}
function selecao({ label, bind, valor, opcoes, re = "none", cls = "", id }) {

}

function chipStatus(l) {
  const venc = l.status === "pendente" && l.data < hoje();

  if (venc) return h`<span class="chip bad">${ico("alert")}Vencido</span>`;
  return h`<span class="chip warn">${l.tipo === "receita" ? "A receber" : "A pagar"}</span>`;
}

/** Barra do termômetro: vermelho | amarelo | verde com ponteiro na margem atual. */
function barraTermo(margem, meta) {
  const t = E.termometro(margem, meta), [c1, c2] = t.cortes, tem = c1 !== c2;
  const p = (x) => (x * 100).toFixed(2) + "%";
  const grad = tem
    ? `linear-gradient(to right,${COR.tBad} 0%,${COR.tBad} ${p(c1)},${COR.tWarn} ${p(c1)},${COR.tWarn} ${p(c2)},${COR.tOk} ${p(c2)},${COR.tOk} 100%)`
    : `linear-gradient(to right,${COR.tBad} 0%,${COR.tBad} ${p(c1)},${COR.tOk} ${p(c1)},${COR.tOk} 100%)`;
  return h`<div class="bar" style="background:${grad}" aria-hidden="true">${tem ? h`<i style="left:calc(${p(c1)} - 1px)"></i><i style="left:calc(${p(c2)} - 1px)"></i>` : h`<i style="left:calc(${p(c1)} - 1px)"></i>`}<b style="left:${p(t.posicao)}"></b></div>
    <div class="barlbl" aria-hidden="true"><span>Prejuízo</span>${tem ? h`<span>Atenção</span>` : ""}<span>Saudável</span></div>`;
}

function mostrarTip(el, ev) {
  const t = $("#tip"), linhas = (el.getAttribute("data-tip") || "").split("\n");
  if (!linhas[0]) return;
  t.innerHTML = `<b>${esc(linhas[0])}</b>` + linhas.slice(1).map((l) => {
    const m = l.match(/^(#[0-9a-f]{6})\|(.*)$/i);
    return m ? `<div><i style="display:inline-block;width:8px;height:8px;border-radius:99px;background:${m[1]};margin-right:6px"></i>${esc(m[2])}</div>` : `<div>${esc(l)}</div>`;
  }).join("");
  t.hidden = false;
  const r = el.getBoundingClientRect(), x = ev && ev.clientX != null ? ev.clientX : r.left + r.width / 2;
  const w = t.offsetWidth, hgt = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + "px";
  t.style.top = Math.max(8, r.top - hgt - 8) + "px";
}

/** Tabela responsiva: vira cartões no celular. cab = rótulos; right/full = índices de colunas. */
function limiarRt(cols) {
  const colunas = cols.trim().split(/\s+/), fixo = (cols.match(/(\d+)px/g) || []).reduce((s, x) => s + parseInt(x, 10), 0);
  const precisa = fixo + (colunas.length - 1) * 10 + 8 + 170; // 170px mínimos para a coluna do nome
  return RT_TIERS.find((t) => t >= precisa) || RT_TIERS[RT_TIERS.length - 1];
}
/* span = colunas que, na tabela larga, ocupam uma linha própria embaixo (ex.: botões de ação). */
function rt({ cols, cab, linhas, right = [], full = [], span = [] }) {
  const cel = (c, i) => h`<div data-l="${cab[i]}" class="${right.includes(i) ? "r" : ""} ${i === 0 || full.includes(i) ? "full" : ""} ${span.includes(i) ? "span" : ""}">${c}</div>`;
  return h`<div class="rt" data-t="${limiarRt(cols)}" style="--cols:${cols}"><div class="rh" aria-hidden="true">${cab.map((c, i) => (span.includes(i) ? "" : h`<div class="${right.includes(i) ? "r" : ""}">${c}</div>`))}</div>
    ${linhas.map((l) => h`<div class="rr ${l.cls || ""}">${l.cels.map(cel)}</div>`)}</div>`;
}

function delta(atual, antes, invertido = false) {
  if (antes == null || !(Math.abs(antes) > 0.005)) return "";
  const v = ((atual - antes) / Math.abs(antes)) * 100, bom = invertido ? v <= 0 : v >= 0;
  return h`<span class="${Math.abs(v) < 0.05 ? "" : bom ? "pos" : "neg"}">${v >= 0 ? "▲" : "▼"} ${nf(Math.abs(v), 1)}%</span>`;
}

const FORMAS_COMPRA = [["boleto", "Boleto"], ["pix", "PIX"], ["transferencia", "Transferência"], ["dinheiro", "Dinheiro"], ["debito", "Débito"], ["credito", "Cartão de crédito"]];

    pago: false, forma: "boleto",

  sincronizarVenc(r);

}
function totaisRascunho(r) {
  const somaItens = r2(r.itens.reduce((s, i) => s + num(i.valorTotal), 0)), imp = r2(r.itens.reduce((s, i) => s + num(i.impostos), 0)), frete = Math.max(0, num(r.frete));
  return { somaItens, imp, frete, total: r2(somaItens + imp + frete) };
}
function sincronizarVenc(r) {
  if (r.venc.length === 1 && r.venc[0].auto) r.venc[0].valor = campoNum(totaisRascunho(r).total);
}
function notaDuplicada(r) {
  const cnpj = soDigitos(r.cnpj), num0 = String(r.numero || "").trim();
  return db.notas.find((n) => (r.chave && n.chave && n.chave === r.chave) || (cnpj && num0 && n.cnpj === cnpj && String(n.numero) === num0)) || null;
}
function custosItens(r) {
  const t = totaisRascunho(r), soma = t.somaItens || 1;
  return r.itens.map((i) => {
    const qtd = num(i.qtd), vt = num(i.valorTotal);
    if (!(qtd > 0) || !(vt > 0)) return null;
    const cu = vt / qtd + (t.frete * (vt / soma)) / qtd + num(i.impostos) / qtd;
    const p = i.produtoId !== "novo" ? prod(i.produtoId) : null;
    if (!p) return { desc: i.descricao, cu, novo: true, sug: E.calcularMarkup(cu, premissasDe(null), 0).precoSugerido };
    const base = Math.max(p.estoque, 0), antes = custoTotal(p);
    return { desc: i.descricao, cu, p, antes, depois: (base * antes + qtd * cu) / (base + qtd), qtd };
  });
}

const ATALHOS_DESC = [0, 3, 5, 10, 15];
const nf3 = (n) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 3, maximumFractionDigits: 3 }).format(n);

const snapProd = (p) => [p.custo.compra, p.custo.frete, p.custo.imp, p.preco].join("|");
function carregarProdutoSim() {
  const s = ui.sim, p = prod(s.produtoId);
  if (p) {
    s.snap = snapProd(p);
    s.custo = { compra: campoNum(p.custo.compra, 2, 4), frete: campoNum(p.custo.frete, 2, 4), imp: campoNum(p.custo.imp, 2, 4) };
    s.preco = campoNum(p.preco);
  } else s.produtoId = "";
  s.descTipo = "percentual"; s.desc = "0"; s.imp = s.fixo = s.meta = null;
}
function garantirSim() {
  const s = ui.sim;
  if (s.produtoId && !prod(s.produtoId)) { s.produtoId = ""; s.iniciado = false; }
  else if (s.produtoId && s.snap !== snapProd(prod(s.produtoId))) carregarProdutoSim(); // custo/preço mudou (ex.: nota nova)
  if (!s.iniciado) {
    s.iniciado = true;
    const p = db.produtos.find((x) => x.ativo);
    if (p) { s.produtoId = p.id; carregarProdutoSim(); }
  }
}
function calcSim() {
  const s = ui.sim, p = prod(s.produtoId);
  const custo = { custoCompra: num(s.custo.compra), custoFrete: num(s.custo.frete), impostosEntrada: num(s.custo.imp) };
  const base = premissasDe(p);
  const premissas = {
    aliquotaImpostoSaidaPct: s.imp != null ? num(s.imp) : base.aliquotaImpostoSaidaPct,
    custosFixosPct: s.fixo != null ? num(s.fixo) : base.custosFixosPct,
    margemAlvoPct: s.meta != null ? num(s.meta) : base.margemAlvoPct,
  };
  const taxas = taxasEngine();
  const pagamento = { forma: s.forma, parcelas: s.forma === "credito" ? s.parcelas : 1 };
  const precoTabela = num(s.preco), quantidade = num(s.qtd) > 0 ? num(s.qtd) : 1;
  const entrada = { custo, premissas, taxas, precoTabela, quantidade, desconto: { tipo: s.descTipo, valor: num(s.desc) }, pagamento };
  const r = E.simular(entrada), ct = E.custoTotalUnitario(custo);
  const taxaCred = E.taxaDaCondicao({ forma: "credito", parcelas: s.parcelas }, taxas).taxaPct;
  return {
    s, p, custo, premissas, taxas, pagamento, entrada, r, ct,
    maxAvista: E.descontoMaximo(precoTabela, ct, premissas, 0), maxCredito: E.descontoMaximo(precoTabela, ct, premissas, taxaCred),
    comparativo: E.tabelaComparativa(entrada), curva: E.curvaDesconto(entrada), markupAvista: E.calcularMarkup(ct, premissas, 0),

}

function simWaterfall(S) {

    ["Imposto sobre a venda", pc(pr.aliquotaImpostoSaidaPct, 1), r.impostosSaidaUnit, "m"], ["Lucro bruto", pc(r.margemBrutaPct, 1), r.lucroBrutoUnit, "t"],
    ["Rateio de custo fixo", pc(pr.custosFixosPct, 1), r.rateioFixoUnit, "m"], ["Lucro operacional", pc(r.margemOperacionalPct, 1), r.lucroOperacionalUnit, "t"],
    ["Taxa da maquininha", pc(r.taxaOperadoraPct, 2), r.taxaOperadoraUnit, "m"], ["Lucro líquido real", pc(r.margemLiquidaPct, 1), r.lucroLiquidoUnit, "t"],
  ];
  return h`<div class="tablewrap"><table class="wf tab"><caption class="sr">Composição do preço até o lucro líquido real</caption><thead><tr><th>Por unidade</th><th class="r">%</th><th class="r">Unitário</th>${varias ? h`<th class="r">× ${nf(q)}</th>` : ""}</tr></thead>

}

function simSaida(S) {

      <div class="row" style="margin-top:14px"><button type="button" class="btn gold lg" data-act="simVender" ${r.precoFinalUnit > 0 ? "" : raw("disabled")}>${ico("check")}Registrar esta venda</button></div>

    <div class="grid g2">${cartaoLimite("Desconto máximo à vista", S.maxAvista, r.descontoPct)}${cartaoLimite(`Desconto máximo no crédito ${s.parcelas}x`, S.maxCredito, r.descontoPct)}</div>

    <section class="card"><header><h2>Indicadores</h2><span class="sub">Condição simulada: ${rotulo}</span></header>
      <div class="grid gk">
        ${kpi("Lucro líquido real", brl(r.lucroLiquidoUnit), r.quantidade !== 1 ? `Total ${brl(r.totais.lucroLiquido)}` : "por unidade", "", r.lucroLiquidoUnit < -0.005 ? "neg" : "")}
        ${kpi("Margem líquida real", pc(r.margemLiquidaPct, 1), `meta ${pc(pr.margemAlvoPct, 1)}`, "", r2(r.lucroLiquidoUnit) < 0 ? "neg" : "")}
        ${kpi("Margem bruta", pc(r.margemBrutaPct, 1), `${brl(r.lucroBrutoUnit)} por un. · operacional ${pc(r.margemOperacionalPct, 1)}`)}
        ${kpi("Markup multiplicador", r.markup.viavel ? "× " + nf3(r.markup.multiplicador) : "inviável", r.markup.viavel ? `divisor ${nf3(r.markup.divisor)}` : "revise as premissas")}
      </div>
      <div class="inset row" style="margin-top:12px;justify-content:space-between">
        <div style="min-width:0;flex:1 1 220px"><p class="strong row" style="gap:6px;flex-wrap:nowrap">${ico("sparkle")}Preço sugerido para a meta de ${pc(pr.margemAlvoPct, 1)}</p>
          <p class="small muted tab" style="margin-top:4px">${r.markup.viavel ? h`<b class="strong">${brl(r.markup.precoSugerido)}</b> no ${rotulo}${!aVista && S.markupAvista.viavel ? h` · <b class="strong">${brl(S.markupAvista.precoSugerido)}</b> à vista` : ""} · markup praticado sobre o custo: ${pc(r.markupPraticadoPct, 1)}` : "Nenhum preço atinge a meta com estas premissas."}</p></div>
        ${r.markup.viavel && Math.abs(r.markup.precoSugerido - r.precoTabela) > 0.004 ? h`<button type="button" class="btn gold" data-act="simUsarPreco" data-v="${r.markup.precoSugerido}">Usar este preço</button>` : ""}
      </div></section>

    <section class="card"><header><h2>Para onde vai cada real da venda</h2><span class="sub">Do preço final até o lucro líquido real</span></header>${simWaterfall(S)}</section>

    <section class="card"><header><h2>Lucro × desconto</h2><span class="sub">Até onde o desconto vai antes de virar prejuízo (lucro líquido por unidade)</span></header>
      ${chartLinhas({ xs: curva.map((p) => p.descontoPct), series, marcaX: r.descontoPct, rotMarca: "Seu desconto", refs: [{ y: 0, rot: "Empate (lucro zero)" }], fmtX: (v) => `${nf(v, 0)}%`, tituloTip: (i) => `Desconto de ${pc(curva[i].descontoPct, 1)}`, fmtY: (v) => brl(v).replace(/,00$/, ""), descricao: "Lucro líquido por unidade conforme o desconto concedido" })}</section>

      <div class="tablewrap"><table class="tab cmp" style="min-width:540px"><thead><tr><th>Condição</th><th class="r">Taxa</th><th class="r">Lucro líq./un.</th><th class="r">Margem</th><th class="r">Desc. máx.</th><th>Situação</th></tr></thead>
      <tbody>${S.comparativo.map((l) => h`<tr class="click ${mesma(l.condicao) ? "sel" : ""}" data-act="simCond" data-f="${l.condicao.forma}" data-p="${l.condicao.parcelas}"><th scope="row" style="font-weight:600;white-space:nowrap">${l.rotulo}</th><td class="r">${pc(l.taxaPct, 2)}</td><td class="r ${l.lucroLiquidoUnit < -0.005 ? "neg" : ""}">${brl(l.lucroLiquidoUnit)}</td><td class="r">${pc(l.margemLiquidaPct, 1)}</td><td class="r">${l.descontoMax.precoTabelaCobreCusto ? pc(l.descontoMax.semPrejuizoPct, 1) : "—"}</td><td>${chipSaudeCurto(l.status)}</td></tr>`)}</tbody></table></div></details></section>`;
}

const simDica = (S) => (S.r.descontoValorUnit > 0 ? `${brl(S.r.descontoValorUnit)} por unidade · ${pc(S.r.descontoPct, 2)} · preço final ${brl(S.r.precoFinalUnit)}` : "Sem desconto. O preço final é o preço de tabela.");
